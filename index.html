function finish(){const r=view.run;stopSpeak();clearInterval(view.tick);const news=[];
  // reading
  r.steps.forEach(s=>{if(s.type==='text'&&s.reading&&s.fin&&!s.skipped){if(!S.read[r.n]){S.read[r.n]=today();addCoins(3)}}});
  // levels
  const groups={};r.steps.forEach(s=>{if(!s.tag)return;const g=groups[s.tag.n+'-'+s.tag.lv]=groups[s.tag.n+'-'+s.tag.lv]||{n:s.tag.n,lv:s.tag.lv,q:0,a:0,ok:0,learn:true,rate:0};
    if(isQ(s.type)){g.q+=s.items.length;s.ans.forEach(x=>{if(x){g.a++;if(x.ok)g.ok++}})}if((s.type==='learn'||s.type==='wordlist')&&!s.fin)g.learn=false;if(s.type==='recap')g.rate=s.rated||0;if(s.type==='comp')s.ans.forEach(x=>{if(x){g.ca=(g.ca||0)+1;if(x.ok)g.cok=(g.cok||0)+1}})});
  view.freshLv=[];Object.values(groups).forEach(g=>{let st=0;
    if(g.learn&&g.a>=Math.min(6,g.q)&&g.a>0){const acc=g.ok/g.a;st=acc===1&&g.a>=g.q?3:acc>=.8?2:acc>=.6?1:0}
    const before=lv(g.n,g.lv);if(st>before){setLv(g.n,g.lv,st);if(!before)news.push({n:g.n,lv:g.lv});if(st>before)view.freshLv.push(g.n+'-'+g.lv);if(st===3&&before<3)addCoins(5)}});
  const acc=r.log.length?r.log.filter(x=>x.ok).length/r.log.length:0;
  S.sessions.push({d:today(),kind:r.kind,n:r.n,q:r.log.length,ok:r.log.filter(x=>x.ok).length,sec:((Date.now()-r.t0)/1000)|0});S.sessions=S.sessions.slice(-120);
  save();view.done={r,news,acc};view.run=null;render()}

function renderDone(){const{r,news,acc}=view.done,wrong=[...new Set(r.log.filter(x=>!x.ok).map(x=>x.k))];paint();
  const q=r.log.length;
  $('#main').innerHTML=`<section class="card"><div class="stage"><div class="ic" style="font-size:52px">${q&&acc>=.8?'🏆':'⚔️'}</div><h2>${q?`答对 ${r.log.filter(x=>x.ok).length} / ${q}`:'完成了'}</h2>
    <p class="muted">这一次赚了 ${r.coins} 🪙 · 用时 ${fmt(((Date.now()-r.t0)/1000)|0)}</p>
    ${(()=>{const R=r.boss;if(!R)return'';const B=S.boss[R.n],b=bossOf(R.n);if(R.won)return`<p style="font:700 18px var(--serif)">💀 ${bi(`打败了宫殿守卫${esc(b[0])}！`,`You defeated the palace guardian ${esc(b[3])}!`)}</p>`;
      if(B.hp>=R.start)return R.started?`<p class="muted">${b[1]} ${bi(`${esc(b[0])}这次没被打到，还剩 ${B.hp} / ${B.max} 血。答对宫殿的题才能攻击它。`,`${esc(b[3])} took no damage this time (${B.hp} / ${B.max} HP). Answer palace questions correctly to attack it.`)}</p>`:'';return`<p>${b[1]} ${bi(`${esc(b[0])}还剩 ${B.hp} / ${B.max} 血，退回宫殿了。你还没打败它，下次接着打${B.hp>B.max*.5?'，可以先去军械库升级兵器':''}。`,`${esc(b[3])} has ${B.hp} / ${B.max} HP left and retreated to the palace. You have not defeated it yet. Keep fighting next time${B.hp>B.max*.5?', and maybe upgrade your weapons at the armory first':''}.`)}</p>`})()}
    ${news.map(x=>`<p style="font:700 18px var(--serif)">${BLD[x.lv][0]} ${esc(L[x.n].city[0])}的${BLD[x.lv][1]}建成了！</p>`).join('')}
    ${wrong.length?`<p class="small muted">错了的这些进了「失地」：</p><div class="chips" style="justify-content:center">${wrong.map(k=>`<span class="chip bad">${esc(label(k))}</span>`).join('')}</div>`:''}
    <div class="row" style="margin-top:16px">${wrong.filter(k=>U[k]||PK[k]||SK[k]).length?'<button class="btn pri grow" id="redo">刚才错的，马上再练</button>':''}<button class="btn grow" id="bk">${view.n&&L[view.n]?'回到'+esc(L[view.n].city[0]):'回去'}</button></div></div></section>`;
  $('#bk').onclick=()=>{view.done=null;render()};
  if($('#redo'))$('#redo').onclick=()=>{view.done=null;startRun('lost',retestSteps(wrong),r.n)};
  if(acc>=.8&&q)sfx.win();
  // celebrate new cities / flags in sequence
  const queue=[];news.forEach(x=>{const n=x.n;view.justBuilt=n;if(!S.founded[n]){S.founded[n]=today();queue.push(()=>{const c=L[n].city;speak(c[0]+'。'+c[2]);return`<div class="ic">🏛️</div><h2>你建起了${esc(c[0])}！</h2><p class="muted">${esc(c[1])}</p><p class="fact" style="text-align:left">${esc(c[2])}</p>`})}
    if([1,2,3].every(k=>lv(n,k))&&!S.armOpen[n]){S.armOpen[n]=today();if(!r.steps.some(s=>s.type==='armory'))queue.push(()=>{view.goArm=true;sfx.win();const b=bossOf(n);const nw=ARMS[stocked()];return`<div class="ic">🛡️</div><h2>${bi(`${esc(L[n].city[0])}的题都做完了！`,`You finished every level in ${esc(L[n].city[0])}!`)}</h2><p class="muted">${bi(`${nw?`军械库到了新货：${nw[1]} ${esc(nw[0])}（🪙${nw[3]}）。`:'军械库开门了。'}你有 🪙 ${S.coins}，去看看，准备打宫殿守卫${esc(b[0])} ${b[1]}。`,`${nw?`New in the armory: ${esc(nw[6])} (${nw[3]} coins). `:'The armory is open. '}You have ${S.coins} coins. Go take a look and get ready to fight ${esc(b[3])}.`)}</p>`})}
    if([1,2,3,4].every(k=>lv(n,k))&&!S.flags[n]){S.flags[n]=today();queue.push(()=>{sfx.win();return`<div class="ic">🚩</div><h2>${esc(L[n].city[0])}全城建成！</h2><p class="muted">城墙、粮仓、书院、宫殿都有了。</p>`})}});
  save();const nx=()=>{const f=queue.shift();if(f)modal(f(),nx,'好 OK');else if(view.goArm){view.goArm=false;view={tab:'arm',n:null,run:null};render()}};nx()}

        <button class="btn ghost" data-swx="1">取消 Cancel</button></div></div>`:'';
    return`<div class="arm ${own?'own':can?'':'lock'}"><span class="ic">${w[1]}</span><div class="grow">${name}<div class="f">${bi(esc(w[5]),esc(w[7]))}</div>${swap}</div>

  document.querySelectorAll('[data-sw]').forEach(b=>b.onclick=()=>{const w=ARMS[+b.dataset.for-1],old=b.dataset.sw,back=Math.floor(priceOf(old)/2);if(!w||S.coins+back<w[3])return;

/* 粒子：火花、火焰、灰尘、余烬、溶解、金币 */
const FX={c:null,ctx:null,ps:[],raf:0,k:1,
  start(cv){this.c=cv;this.ctx=cv.getContext('2d');this.ps=[];const fit=()=>{const r=cv.getBoundingClientRect(),d=Math.min(2,window.devicePixelRatio||1);cv.width=r.width*d;cv.height=r.height*d;this.k=cv.width/400;this.oy=(cv.height-250*this.k)/2};fit();this.fit=fit;
    const loop=()=>{this.step();this.raf=requestAnimationFrame(loop)};cancelAnimationFrame(this.raf);loop()},
  stop(){cancelAnimationFrame(this.raf);this.ps=[];this.c=null},
  add(p){if(this.ps.length<500)this.ps.push(Object.assign({vx:0,vy:0,g:0,life:0,max:40,size:2,color:'#ffd27a',drag:.98,glow:true,shape:'c'},p))},
  sparks(x,y,n,cols,sp=4){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,v=sp*(.4+Math.random());this.add({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-1,g:.18,max:18+Math.random()*16,size:1+Math.random()*2.2,color:cols[i%cols.length],shape:'l'})}},
  fire(x1,y1,x2,y2,ms,cols){const t0=performance.now(),id=setInterval(()=>{if(performance.now()-t0>ms)return clearInterval(id);for(let i=0;i<6;i++){const f=Math.random();this.add({x:x1,y:y1+(Math.random()-.5)*6,vx:(x2-x1)/22*(.8+Math.random()*.4),vy:(y2-y1)/22+(Math.random()-.5)*1.6,max:22+Math.random()*10,size:5+Math.random()*7,color:cols[(Math.random()*cols.length)|0],drag:.97,grow:-.12})}},16)},
  dust(x,y,n){for(let i=0;i<n;i++)this.add({x:x+(Math.random()-.5)*30,y,vx:(Math.random()-.5)*2,vy:-Math.random()*1.2,max:30+Math.random()*20,size:4+Math.random()*5,color:'rgba(190,160,130,.35)',glow:false,grow:.12})},
  dissolve(cols){for(let i=0;i<160;i++){const a=Math.random()*Math.PI*2,r=Math.random();this.add({x:292+Math.cos(a)*r*70,y:160+Math.sin(a)*r*50,vx:(Math.random()-.5)*1.5,vy:-Math.random()*2.4-.4,max:50+Math.random()*50,size:1.5+Math.random()*3,color:cols[i%cols.length],drag:.99})}},
  coins(x,y,n){for(let i=0;i<n;i++)this.add({x,y,vx:(Math.random()-.5)*7,vy:-4-Math.random()*5,g:.25,max:60,size:3.5,color:'#ffd34a',shape:'coin',glow:false,drag:.99})},
  step(){const c=this.ctx;if(!c)return;if(this.c&&!this.c.isConnected)return this.stop();c.setTransform(1,0,0,1,0,0);c.clearRect(0,0,this.c.width,this.c.height);c.setTransform(this.k,0,0,this.k,0,this.oy||0);
    if(Math.random()<.25)this.add({x:Math.random()*400,y:250,vx:(Math.random()-.5)*.3,vy:-.4-Math.random()*.6,max:160,size:.8+Math.random()*1.4,color:'#ffae5a',drag:1});
    const out=[];for(const p of this.ps){p.life++;if(p.life>p.max)continue;p.vx*=p.drag;p.vy=p.vy*p.drag+p.g;p.x+=p.vx;p.y+=p.vy;if(p.grow)p.size=Math.max(.3,p.size+p.grow);out.push(p);
      const a=1-p.life/p.max;c.globalAlpha=Math.max(0,a);c.globalCompositeOperation=p.glow?'lighter':'source-over';
      if(p.shape==='l'){c.strokeStyle=p.color;c.lineWidth=p.size;c.lineCap='round';c.beginPath();c.moveTo(p.x,p.y);c.lineTo(p.x-p.vx*2.2,p.y-p.vy*2.2);c.stroke()}
      else if(p.shape==='coin'){c.fillStyle=p.color;c.beginPath();c.ellipse(p.x,p.y,p.size*Math.abs(Math.cos(p.life/4))+.6,p.size,0,0,7);c.fill();c.strokeStyle='#a8771a';c.lineWidth=.8;c.stroke()}
      else{c.fillStyle=p.color;c.beginPath();c.arc(p.x,p.y,p.size,0,7);c.fill()}}
    c.globalAlpha=1;c.globalCompositeOperation='source-over';this.ps=out}};

    <button class="big" id="go" ${p.steps.length?'':'disabled'}>开始复习</button></section>`;

  document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{R.m=+b.dataset.m;renderReview()});

  if($('#rwX'))$('#rwX').onclick=()=>{S.spent=S.earned;save();renderParent()};
  $('#sfxT').onclick=()=>{S.sfx=!S.sfx;save();renderParent()};
  $('#padT').onclick=()=>{S.paper=!S.paper;save();renderParent()};
  $('#tts').onclick=()=>{pickVoice();$('#vn').textContent=zh?zh.name:'没找到中文声音';speak('郑和率领船队七次远渡重洋。')};
  $('#exp').onclick=()=>{const b=new Blob([JSON.stringify(S)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='edwin-zhongwen-'+today()+'.json';a.click()};
  $('#imp').onclick=()=>$('#file').click();
  $('#file').onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const o=JSON.parse(rd.result);if(!o.log)throw 0;S=Object.assign({},S0,o);migrate();save();render();toast('已导入')}catch(x){toast('这个文件不是备份文件')}};rd.readAsText(f);e.target.value=''};
  $('#rst').onclick=()=>{if(confirm('清空所有学习记录？这一步不能撤销。')){S={...S0,log:{},lv:{},days:[],sessions:[],read:{},founded:{},flags:{},recap:{},cleared:[],reward:{text:'',target:60},earned:0,arms:[],boss:{},armOpen:{}};save();render()}}}

/* ====================== 多设备同步（存在 Wendi 的 Google Drive，和 Eric 版共用同一个 Apps Script，kid=edwin） ====================== */
const SYNC_URL='https://script.google.com/macros/s/AKfycbwxFxHEbEV2Y_l72QCt7Imk9198Sza_zPMrmnKoCgwexwKdTVpjFJKpvebSnzMlqPD-/exec';
const SYK=KEY+'.sync',BK=KEY+'.base',KID='edwin';
let SY={};try{SY=JSON.parse(localStorage.getItem(SYK)||'null')||{}}catch(e){}
const syncUrl=()=>SY.url||SYNC_URL;
const syncOn=()=>!!(syncUrl()&&SY.code&&SY.linked);
const sySave=()=>{try{localStorage.setItem(SYK,JSON.stringify(SY))}catch(e){}};
const getBase=()=>{try{return JSON.parse(localStorage.getItem(BK)||'null')}catch(e){return null}};
const setBase=d=>{try{localStorage.setItem(BK,JSON.stringify(d))}catch(e){}};
const J=x=>JSON.stringify(x);
// 三方合并：b=上次同步时的版本，l=这台设备，s=云端。
// 金币类两边的增量相加；关卡星级、兑换点取大；Boss 剩余血量取小；数组合并去重；其他以这台设备为准
const COUNTERS=new Set(['coins','earned']),MAXK=/^(lv\.|spent$)/,MINK=/^boss\.[^.]+\.hp$/;
function m3(b,l,s,path){
  if(J(l)===J(b))return s;if(J(s)===J(b))return l;
  if(typeof l==='number'&&typeof s==='number'){if(COUNTERS.has(path))return s+l-(typeof b==='number'?b:0);if(MAXK.test(path))return Math.max(l,s);if(MINK.test(path))return Math.min(l,s);return l}
  if(Array.isArray(l)&&Array.isArray(s)){const seen=new Set(s.map(J)),out=[...s];l.forEach(x=>{const k=J(x);if(!seen.has(k)){seen.add(k);out.push(x)}});
    if(path==='sessions')out.sort((x,y)=>String(x.d).localeCompare(String(y.d)));if(path==='days')out.sort();return out}
  if(l&&s&&typeof l==='object'&&typeof s==='object'&&!Array.isArray(l)&&!Array.isArray(s)){const o={},bb=b&&typeof b==='object'?b:{};
    new Set([...Object.keys(l),...Object.keys(s)]).forEach(k=>{const v=m3(bb[k],l[k],s[k],path?path+'.'+k:k);if(v!==undefined)o[k]=v});return o}
  return l}
const isBusy=()=>!!(view.run||view.tapping||view.done);
const fresh=()=>!S.sessions.length&&!S.coins&&!Object.keys(S.log).length;
function syLoad(data){S=Object.assign({},S0,data);migrate()}
function syAdopt(data,rev){syLoad(data);SY.rev=rev;SY.dirty=false;setBase(data);save(true)}
const syQ=()=>{const u=syncUrl();return u+(u.includes('?')?'&':'?')+'key='+encodeURIComponent(SY.code)+'&kid='+KID+'&t='+Date.now()};
async function syFetch(body){const o={cache:'no-store',credentials:'omit',redirect:'follow'};
  const r=body?await fetch(syncUrl(),{...o,method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:J(body)}):await fetch(syQ(),o);
  if(!r.ok)throw new Error('HTTP '+r.status);const t=await r.text();try{return JSON.parse(t)}catch(e){throw new Error('回应不是数据：'+t.slice(0,40))}}
// 备用通道：有的设备/网络挡了跨域 fetch，就用 <script> 读（JSONP），写的时候用 no-cors POST 再读回来确认
function syJsonp(){return new Promise((res,rej)=>{const cb='__sy'+Date.now()+(Math.random()*1e4|0),s=document.createElement('script');let done=false;
  const end=e=>{if(done)return;done=true;clearTimeout(t);delete window[cb];s.remove();e?rej(e):0};
  window[cb]=d=>{end();res(d)};s.onerror=()=>end(new Error('备用通道也连不上'));const t=setTimeout(()=>end(new Error('备用通道超时')),20000);
  s.src=syQ()+'&callback='+cb;document.head.appendChild(s)})}
async function syReqAlt(body){if(!body)return syJsonp();
  await fetch(syncUrl(),{method:'POST',mode:'no-cors',cache:'no-store',credentials:'omit',body:J(body)});
  const s=await syJsonp();if(!s.ok)return s;
  if(s.rev===body.baseRev+1&&J(s.data)===J(body.data))return{ok:true,rev:s.rev};
  if(s.rev!==body.baseRev)return{ok:false,conflict:true,rev:s.rev,data:s.data};
  throw new Error('上传没成功')}
async function syReq(body){
  if(SY.alt)return syReqAlt(body);
  try{return await syFetch(body)}catch(e){SY.fetchErr=String(e&&e.message||e);
    const r=await syReqAlt(body);SY.alt=true;sySave();return r}}
let syT=null,syBusy=false;
function syncDirty(){if(!syncOn())return;SY.dirty=true;sySave();clearTimeout(syT);syT=setTimeout(()=>syncNow(),2500)}
async function syncNow(){if(!syncOn()||syBusy||!navigator.onLine)return;syBusy=true;let changed=false;
  try{let r=await syReq();if(!r.ok)throw new Error(r.err==='key'?'同步码不对':r.err||'云端出错');
    for(let tries=0;;tries++){
      if(r.rev!==SY.rev&&r.data){
        if(isBusy()){SY.later=true;break}
        if(!SY.dirty){syAdopt(r.data,r.rev);changed=true;break}
        const m=m3(getBase()||{},JSON.parse(J(S)),r.data,'');syLoad(m);SY.rev=r.rev;save(true);changed=true}
      else if(!SY.dirty){SY.rev=r.rev;break}
      const data=JSON.parse(J(S)),p=await syReq({key:SY.code,kid:KID,baseRev:SY.rev||0,data});
      if(p.ok){SY.rev=p.rev;SY.dirty=false;setBase(data);break}
      if(p.conflict&&tries<3){r=p;continue}
      throw new Error(p.err==='key'?'同步码不对':'上传失败')}
    SY.last=Date.now();SY.err=''}
  catch(e){SY.err=(e instanceof TypeError?'暂时连不上网，联网后会自动补传':String(e&&e.message||e))+(SY.fetchErr?'（'+SY.fetchErr+'）':'')}
  finally{syBusy=false;sySave();paintSync();if(changed&&!isBusy()&&!$('#modal').innerHTML)render()}}
function paintSync(){const el=$('#syncSt');if(!el)return;
  el.innerHTML=SY.err?`<span style="color:var(--red)">⚠️ ${esc(SY.err)}</span>`:SY.last?`✓ 上次同步 ${md(dstr(new Date(SY.last)))} ${new Date(SY.last).toTimeString().slice(0,5)}${SY.dirty?' · 有新记录等上传':''}`:'连接中…'}
async function syncLink(code){code=code.trim().toLowerCase();if(!code)return toast('请输入同步码');if(!syncUrl())return toast('云端还没设置好');
  SY.code=code;let r;try{r=await syReq()}catch(e){SY.code='';return toast('连不上云端：'+(e&&e.message||e)+(SY.fetchErr?' / '+SY.fetchErr:''))}
  if(!r.ok){SY.code='';return toast(r.err==='key'?'同步码不对':'云端出错')}
  const go=mode=>{$('#modal').innerHTML='';SY.linked=true;
    if(mode==='cloud')syAdopt(r.data,r.rev);
    else{SY.rev=r.data?r.rev:(r.rev||0);setBase({});SY.dirty=true;if(r.data){syLoad(m3({},JSON.parse(J(S)),r.data,''));save(true)}}
    sySave();toast('已连接，开始同步');render();syncNow()};
  if(!r.data||fresh())return go(r.data?'cloud':'mine');
  $('#modal').innerHTML=`<div class="modal"><div class="box"><div class="ic">☁️</div><h2>云端已经有记录了</h2>
    <p class="muted small">这台设备上也有记录（🪙 ${S.coins}，${S.sessions.length} 次练习）。云端是别的设备上传的。</p>
    <button class="big" id="syM">合并两边（推荐）</button><p class="small muted">金币、兵器、城池、失地都合在一起。</p>
    <button class="btn" style="width:100%;margin-top:6px" id="syC">只用云端的，这台的不要了</button>
    <button class="btn ghost" style="width:100%;margin-top:6px" id="syX">先不连</button></div></div>`;
  $('#syM').onclick=()=>go('mine');$('#syC').onclick=()=>go('cloud');$('#syX').onclick=()=>{SY.code='';$('#modal').innerHTML=''}}
function syncCard(){
  return`<section class="card"><h3>☁️ 多设备同步</h3>
    ${syncOn()?`<p class="small muted">这台设备已经连上，记录会自动和其他设备互通（存在妈妈的 Google Drive，每天自动另存一份备份）。</p>
      <div class="small" id="syncSt"></div>
      <div class="row" style="margin-top:8px"><button class="btn grow" id="syNow">立即同步</button><button class="btn ghost grow" id="syOff">这台设备断开</button></div>`
    :syncUrl()?`<p class="small muted">在每台设备上输一次同步码，金币、兵器、城池和失地就会自动互通。</p>
      <div class="row"><input class="in" id="syCode" placeholder="同步码" autocapitalize="off" autocomplete="off" style="flex:1"><button class="btn pri" id="syGo">连接</button></div>`
    :`<p class="small muted">云端还没设置好。</p>`}
    <details style="margin-top:8px"><summary class="small muted">高级</summary><input class="in" id="syUrl" placeholder="同步网址（一般不用填）" value="${esc(SY.url||'')}" style="margin-top:8px;width:100%"><button class="btn" style="margin-top:6px" id="syUrlS">保存网址</button></details>
  </section>`}
function bindSync(){paintSync();
  if($('#syGo'))$('#syGo').onclick=()=>syncLink($('#syCode').value);
  if($('#syNow'))$('#syNow').onclick=async()=>{SY.err='';paintSync();await syncNow();toast(SY.err?'同步失败：'+SY.err:'同步好了')};
  if($('#syOff'))$('#syOff').onclick=()=>{SY={url:SY.url};sySave();toast('这台设备已断开，记录还在本机');render()};
  $('#syUrlS').onclick=()=>{SY.url=$('#syUrl').value.trim();SY.linked=false;sySave();render()}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')syncNow();else if(SY.dirty)syncNow()});
window.addEventListener('online',()=>syncNow());

if('serviceWorker'in navigator&&location.protocol==='https:'&&!/claude/.test(location.host))navigator.serviceWorker.register('sw.js').catch(()=>{});
render();
if(S.armNote){const N=S.armNote;delete S.armNote;save();modal(`<div class="ic">🎒</div><h2>${bi('新规则：最多带两件兵器','New rule: carry at most 2 weapons')}</h2><p class="muted">${bi(`留下了最强的 ${N.keep.join('、')}；${N.drop.join('、')} 卖回一半，退给你 🪙${N.back}。`,`You kept your 2 strongest weapons. The others were sold back for half price: +${N.back} coins.`)}</p>`,null,'好 OK')}
syncNow();
</script>
