<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Edwin中文">
<meta name="theme-color" content="#20333a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Edwin 的中文帝国</title>
<style>
:root{--bg:#e7e2d4;--card:#f7f3e9;--soft:#ece5d4;--ink:#1e2b31;--mute:#5d686d;--line:#cdc3ab;
  --jade:#2c7560;--bronze:#9c6420;--red:#ad3524;--gold:#c08d22;--slate:#20333a;
  --serif:"Songti SC","STSong","Noto Serif SC","Source Han Serif SC",serif;
  --sans:-apple-system,"PingFang SC","Hiragino Sans GB","Noto Sans SC",system-ui,sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141d21;--card:#1d2a30;--soft:#24343b;--ink:#ece4d2;--mute:#9ba6a8;--line:#33464d;--jade:#5db190;--bronze:#d6a04f;--red:#e06a55;--gold:#e2b54d;--slate:#0f171a}}
:root[data-theme="dark"]{--bg:#141d21;--card:#1d2a30;--soft:#24343b;--ink:#ece4d2;--mute:#9ba6a8;--line:#33464d;--jade:#5db190;--bronze:#d6a04f;--red:#e06a55;--gold:#e2b54d;--slate:#0f171a}
*,*:before,*:after{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--sans);-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:860px;margin:0 auto;padding:0 14px 40px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--slate);color:#ecd9a8;margin:0 -14px;padding:10px 16px;display:flex;align-items:center;gap:12px}
header.top h1{font:700 20px/1.2 var(--serif);margin:0;letter-spacing:.06em;flex:1}
.pill{display:inline-flex;align-items:center;gap:4px;background:rgba(255,255,255,.08);border:1px solid rgba(236,217,168,.35);border-radius:999px;padding:3px 10px;font-size:14px;color:#ecd9a8}
.pill.done{background:#2c7560;border-color:#2c7560;color:#fff}
nav.tabs{display:flex;gap:4px;margin:12px 0}
nav.tabs button{flex:1;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 4px;font-size:15px}
nav.tabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
h2{font:700 22px/1.3 var(--serif);margin:0 0 6px}
h3{font:700 17px/1.3 var(--serif);margin:0 0 8px}
.muted{color:var(--mute)}.small{font-size:13.5px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.grow{flex:1}
.btn{border:1px solid var(--line);background:var(--soft);border-radius:10px;padding:10px 14px;min-height:44px}
.btn.pri{background:var(--jade);border-color:var(--jade);color:#fff;font-weight:700}
.btn.bad{background:transparent;border-color:var(--red);color:var(--red)}
.btn.ok{background:var(--jade);border-color:var(--jade);color:#fff}
.btn.ghost{background:none;border:none;padding:6px 0;color:var(--mute)}
.btn:disabled{opacity:.45;cursor:default}
.big{display:block;width:100%;border:none;border-radius:12px;padding:15px;font-size:18px;font-weight:700;background:var(--bronze);color:#fff;min-height:54px}
.big:disabled{opacity:.5}
/* hero */
.hero{background:var(--slate);color:#ecd9a8;border-radius:16px;padding:18px;margin-bottom:12px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;inset:auto -40px -60px auto;width:200px;height:200px;border:2px solid rgba(201,154,62,.25);border-radius:50%}
.hero .stats{display:flex;gap:18px;margin:10px 0 14px;flex-wrap:wrap}
.hero .stats b{display:block;font:700 26px/1 var(--serif);color:#fff}
.hero .stats span{font-size:13px;opacity:.8}
.hero .big{background:var(--gold);color:#1e2b31}
.hero .task{font-size:14px;opacity:.85;margin-top:8px}
/* map */
.mapwrap{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 12px 0;margin-bottom:12px}
.map{position:relative;margin:0 -12px;overflow:hidden;border-radius:0 0 14px 14px;
  background:radial-gradient(ellipse 60% 18% at 18% 12%,rgba(92,140,96,.22),transparent 70%),radial-gradient(ellipse 50% 14% at 85% 38%,rgba(160,130,70,.22),transparent 70%),
  radial-gradient(ellipse 55% 16% at 20% 64%,rgba(92,140,96,.2),transparent 70%),radial-gradient(ellipse 50% 14% at 80% 88%,rgba(70,120,150,.2),transparent 70%),linear-gradient(180deg,#dcd3b9,#d2c7a6)}
:root[data-theme="dark"] .map{background:linear-gradient(180deg,#22323a,#1b2930)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .map{background:linear-gradient(180deg,#22323a,#1b2930)}}
.map svg.road{position:absolute;inset:0;width:100%;height:100%;animation:reveal 2s ease-out both}
@keyframes reveal{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0 0 0 0)}}
.cty{position:absolute;width:150px;margin-left:-75px;text-align:center;animation:stamp .5s cubic-bezier(.3,1.6,.5,1) both}
@keyframes stamp{from{transform:scale(1.6);opacity:0}to{transform:none;opacity:1}}
.cty .disc{position:relative;width:88px;height:88px;border-radius:50%;margin:0 auto;display:grid;place-items:center;border:none;padding:0;
  font:800 24px/1 var(--serif);letter-spacing:.02em;color:#fff7e0;background:radial-gradient(circle at 35% 30%,#4f8f78,#22574a 72%);box-shadow:0 6px 0 #173d34,0 12px 18px rgba(0,0,0,.25)}
.cty .disc.long{font-size:19px}
.cty.fog .disc{color:#6f6a5f;background:radial-gradient(circle at 35% 30%,#efe9da,#b9b09c 72%);box-shadow:0 6px 0 #8f8774,0 12px 18px rgba(0,0,0,.18)}
.cty .disc:active{transform:translateY(4px);box-shadow:0 2px 0 #173d34}
.cty.cur .disc:before{content:"";position:absolute;inset:-10px;border-radius:50%;border:4px solid rgba(201,154,62,.75);animation:ring 1.8s ease-out infinite}
@keyframes ring{from{transform:scale(.9);opacity:1}to{transform:scale(1.4);opacity:0}}
.cty .fogc{position:absolute;left:-14px;bottom:-4px;font-size:30px;opacity:.85;animation:drift 5s ease-in-out infinite}
@keyframes drift{0%,100%{transform:translateX(0)}50%{transform:translateX(26px)}}
.cty .flag{position:absolute;top:-22px;right:-8px;font-size:28px;transform-origin:20% 90%;animation:wave 1.4s ease-in-out infinite}
@keyframes wave{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(8deg)}}
.cty .crown{position:absolute;top:-20px;left:-6px;font-size:26px}
.cty .nm{display:inline-block;margin-top:10px;font-size:12.5px;font-weight:700;background:var(--card);color:var(--ink);border-radius:99px;padding:2px 10px;box-shadow:0 1px 3px rgba(0,0,0,.15);max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cty .era{font-size:11px;color:var(--mute);margin-top:2px}
.cty .bld{display:flex;gap:3px;justify-content:center;margin-top:3px}
.cty .bld i{font-style:normal;font-size:13px;filter:grayscale(1);opacity:.35}.cty .bld i.on{filter:none;opacity:1}
.rider{position:absolute;font-size:40px;z-index:3;pointer-events:none;animation:bob 1.5s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-9px) rotate(3deg)}}
.deco{position:absolute;font-size:26px;opacity:.75;pointer-events:none}
.cloud{position:absolute;font-size:34px;opacity:.55;pointer-events:none;animation:sky 38s linear infinite}
@keyframes sky{from{transform:translateX(-30vw)}to{transform:translateX(110vw)}}
.cty.new{animation:stamp .9s cubic-bezier(.3,1.6,.5,1) .6s both}
/* lesson page */
.lv{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:8px;background:var(--soft);width:100%;text-align:left}
.lv .ic{font-size:26px;width:40px;text-align:center}
.lv b{display:block;font-size:16px}
.lv .st{margin-left:auto;font-size:15px;letter-spacing:1px;white-space:nowrap}
.lv:disabled{opacity:.5}
.lv.fresh{border-color:var(--gold);box-shadow:0 0 0 3px rgba(192,141,34,.35);animation:stamp .6s cubic-bezier(.3,1.6,.5,1) both}
.fact{border-left:4px solid var(--bronze);padding:6px 12px;margin:10px 0 0;font-family:var(--serif)}
/* run */
.runtop{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.x{border:none;background:var(--soft);border-radius:50%;width:38px;height:38px;font-size:18px}
.bar{flex:1;height:8px;background:var(--soft);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--jade);transition:width .3s}
.fin{border:1px solid var(--jade);background:none;color:var(--jade);border-radius:8px;padding:6px 10px;font-weight:700}
.lab{font-size:13px;color:var(--mute);margin-bottom:4px}
.stage{text-align:center;padding:6px 0}
.hz{font:800 64px/1.15 var(--serif);margin:8px 0}
.hz.w{font-size:52px}
.py{font-size:22px;color:var(--bronze);min-height:30px}
.spk{border:none;background:var(--jade);color:#fff;border-radius:50%;width:76px;height:76px;font-size:32px;margin:10px auto;display:block}
.spk.sm{width:52px;height:52px;font-size:22px}
.spk[hidden]{display:none}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.opt{border:2px solid var(--line);background:var(--card);border-radius:12px;padding:14px 6px;font:700 28px/1.2 var(--serif);min-height:64px}
.opt.sm{font-size:20px}
.opt.right{border-color:var(--jade);background:rgba(44,117,96,.15)}
.opt.wrong{border-color:var(--red);background:rgba(173,53,36,.12)}
.ctx{font:600 22px/1.7 var(--serif);margin:12px 0;padding:10px;background:var(--soft);border-radius:10px}
.ctx u{text-decoration:none;border-bottom:3px solid var(--bronze);padding:0 6px;color:var(--bronze)}
.qnav{display:flex;justify-content:space-between;margin-top:14px}
.qnav button{border:none;background:none;color:var(--mute);padding:8px}
.fb{min-height:26px;font-weight:700;margin-top:8px}.fb.ok{color:var(--jade)}.fb.bad{color:var(--red)}
.chunks{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}
.chunk{border:2px solid var(--line);background:var(--card);border-radius:10px;padding:10px 12px;font:600 20px/1.2 var(--serif)}
.chunk.used{visibility:hidden}
.built{min-height:56px;border:2px dashed var(--line);border-radius:12px;padding:10px;font:600 22px/1.6 var(--serif);text-align:left}
.text p{font:500 20px/1.9 var(--serif);margin:0 0 10px}
.text p span{cursor:pointer;border-radius:3px}.text p span.hl{background:rgba(192,141,34,.3)}
.text .ln{display:flex;gap:6px;align-items:flex-start}.text .ln button{border:none;background:var(--soft);border-radius:8px;min-width:36px;height:36px;margin-top:6px}
.wordpop{display:flex;align-items:center;gap:10px;justify-content:center;background:var(--soft);border-radius:10px;padding:8px;margin:6px 0}
.wordpop b{font:700 26px var(--serif)}.wordpop .p{color:var(--bronze)}
.cues{counter-reset:c;list-style:none;padding:0;margin:10px 0}
.cues li{counter-increment:c;font:600 19px/1.5 var(--serif);padding:8px 10px 8px 40px;position:relative;border-bottom:1px solid var(--line)}
.cues li:before{content:counter(c);position:absolute;left:8px;top:8px;width:24px;height:24px;border-radius:50%;background:var(--bronze);color:#fff;font:700 14px/24px var(--sans);text-align:center}
.timer{font:800 54px/1 var(--serif);text-align:center;margin:8px 0;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);border-radius:8px;padding:4px 8px;font:600 17px var(--serif);background:var(--card)}
.chip.ok{border-color:var(--jade);color:var(--jade)}.chip.bad{border-color:var(--red);color:var(--red)}.chip.mid{border-color:var(--gold)}
button.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.weeks{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}.weeks div{height:30px;border-radius:6px;background:var(--soft);display:grid;place-items:center;font-size:11px;color:var(--mute)}.weeks div.on{background:var(--jade);color:#fff}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}
.meter{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--soft);min-width:90px}.meter i{display:block}
select,.in{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:10px;font:inherit;min-height:44px}
.switch{display:flex;justify-content:space-between;align-items:center;padding:8px 0}
.toggle{width:52px;height:30px;border-radius:15px;border:none;background:var(--line);position:relative}.toggle:after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .2s}.toggle.on{background:var(--jade)}.toggle.on:after{left:25px}
.modal{position:fixed;inset:0;background:rgba(10,15,18,.6);display:grid;place-items:center;z-index:20;padding:20px}
.modal .box{background:var(--card);border-radius:18px;padding:24px;max-width:380px;width:100%;text-align:center;animation:pop .35s ease}
.modal .ic{font-size:56px}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,40px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;opacity:0;transition:.25s;z-index:30;pointer-events:none;font-size:15px}
.toast.on{opacity:1;transform:translate(-50%,0)}
.shake{animation:sh .35s}@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.coin{position:fixed;z-index:40;font-size:22px;pointer-events:none;transition:transform .7s cubic-bezier(.5,-.2,.6,1),opacity .7s}
/* armory */
.arm{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:8px;background:var(--soft)}
.arm .ic{font-size:30px;width:44px;text-align:center}
.arm b{font:700 17px var(--serif)}.arm .f{font-size:13px;color:var(--mute);line-height:1.45}
.arm .buy{margin-left:auto;white-space:nowrap;min-width:84px}
.arm.own{border-color:var(--jade);background:rgba(44,117,96,.1)}
.arm.lock{opacity:.6}
.atk{display:flex;align-items:center;gap:10px;background:var(--slate);color:#ecd9a8;border-radius:12px;padding:12px 14px}
.atk b{font:800 30px/1 var(--serif);color:#fff}
.kit{display:flex;flex-wrap:wrap;gap:4px;font-size:24px;margin-left:auto}
/* boss */
.bossbar{margin-top:10px;display:flex;align-items:center;gap:10px;background:var(--slate);color:#ecd9a8;border-radius:12px;padding:8px 12px;margin-bottom:10px}
.bossbar .be{font-size:36px;line-height:1}
.bossbar .hp{height:10px;background:rgba(255,255,255,.15);border-radius:5px;overflow:hidden;margin-top:4px}.bossbar .hp i{display:block;height:100%;background:linear-gradient(90deg,#e06a55,#c08d22);transition:width .3s}
.bossbar.hit{animation:hitme .5s}.bossbar .say{font-size:12.5px;color:#f0b4a6}
@keyframes hitme{0%,100%{transform:none;background:var(--slate)}20%{transform:translateX(-8px);background:#7a2418}60%{transform:translateX(8px)}}
#boss{position:fixed;inset:0;z-index:25;background:radial-gradient(circle at 50% 40%,#3a2a20,#120c09 75%);color:#ecd9a8;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#boss.on{display:flex}
#boss .bt{font:800 26px var(--serif)}
#boss .bm{font-size:150px;line-height:1.1;margin:10px 0;border:none;background:none;padding:0;transition:transform .06s}
#boss .bm.hurt{transform:scale(.9) rotate(-4deg)}
#boss .bhp{width:min(420px,90vw);height:16px;background:rgba(255,255,255,.12);border-radius:8px;overflow:hidden}#boss .bhp i{display:block;height:100%;background:linear-gradient(90deg,#e06a55,#c08d22);transition:width .15s}
#boss .cd{font:800 40px var(--serif);color:#fff;margin-top:10px;font-variant-numeric:tabular-nums}
.dmg{position:fixed;z-index:26;font:800 28px var(--serif);color:#ffd36b;pointer-events:none;text-shadow:0 2px 6px #000;animation:fly .8s ease-out forwards}
.dmg.crit{font-size:44px;color:#ff7a5c}
@keyframes fly{from{transform:translate(-50%,0) scale(1);opacity:1}to{transform:translate(-50%,-90px) scale(1.3);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (min-width:700px){.hz{font-size:84px}.opts{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top"><h1 id="ttl">Edwin 中文</h1><span class="pill" id="pCoin">🪙 0</span><span class="pill" id="pWeek">本周</span></header>
  <nav class="tabs" id="tabs"></nav>
  <main id="main"></main>
</div>
<div id="boss" role="dialog" aria-label="Boss 战"></div><div id="modal"></div><div class="toast" id="toast"></div>

<script>
const D={"kid": "Edwin", "book": "暨南大学《中文》第八册（2020年第1版）", "lessons": [{"n": 1, "t": "开学典礼", "unit": 1, "text": ["今天是中文学校开学的日子。爸爸、妈妈带着我很早就来到了学校。", "开学典礼的会场设在一个大会议厅里。我和爸爸、妈妈走进会场坐下来。我抬头一看，主席台正面墙上贴着“开学典礼”四个大字，台前摆满了鲜花，会场上挂着“热烈欢迎新同学”的标语，整个会场显得庄重而又热烈。不久，台下坐满了同学和家长。大人们互相握手问好，同学们有说有笑，会场上一片欢乐。", "过了一会儿，校长走上主席台，对大家说：“同学们，家长们，你们好！”会场上顿时安静下来。校长接着宣布：“开学典礼现在开始！”会场上响起一阵热烈的掌声。校长首先对新同学表示热烈欢迎，接着介绍了学校的办学情况。她说，咱们学校开办初期只有四五十名学生，现在已经有几百人了，这说明中文教育越来越受欢迎。随着中外经贸、文化等往来日益频繁，世界上用中文的人越来越多，中文的用处越来越大，希望同学们努力学习。最后她还说，感谢广大家长和社会各界人士对中文学校的帮助。讲到这里，校长向台下鞠躬敬礼，台下又响起一阵热烈的掌声。", "校长讲完话后，学生代表和家长代表先后发言。接下来由老同学表演节目。他们表演的节目有中国舞蹈、诗歌朗诵、小合唱和讲故事等。他们的普通话都说得很标准，很好听。每一个节目都非常受欢迎，赢得了阵阵掌声。", "最后，开学典礼在欢快的中国乐曲声中结束。"], "sections": [], "units": [{"w": "会场", "py": "huìchǎng", "h": "会场", "kind": "word", "ctx": ["开学典礼的会场设在一个大会议厅里", "我和爸爸、妈妈走进会场坐下来", "会场上挂着“热烈欢迎新同学”的标语"]}, {"w": "热烈", "py": "rèliè", "h": "热烈", "kind": "word", "ctx": ["会场上挂着“热烈欢迎新同学”的标语", "整个会场显得庄重而又热烈", "会场上响起一阵热烈的掌声"]}, {"w": "互相", "py": "hùxiāng", "h": "互相", "kind": "word", "ctx": ["大人们互相握手问好"]}, {"w": "握手", "py": "wòshǒu", "h": "握手", "kind": "word", "ctx": ["大人们互相握手问好"]}, {"w": "问好", "py": "wènhǎo", "h": "问好", "kind": "word", "ctx": ["大人们互相握手问好"]}, {"w": "宣布", "py": "xuānbù", "h": "宣布", "kind": "word", "ctx": ["校长接着宣布，开学典礼现在开始"]}, {"w": "首先", "py": "shǒuxiān", "h": "首先", "kind": "word", "ctx": ["校长首先对新同学表示热烈欢迎"]}, {"w": "介绍", "py": "jièshào", "h": "介绍", "kind": "word", "ctx": ["接着介绍了学校的办学情况"]}, {"w": "咱们", "py": "zánmen", "h": "咱们", "kind": "word", "ctx": ["咱们学校开办初期只有四五十名学生"]}, {"w": "说明", "py": "shuōmíng", "h": "说明", "kind": "word", "ctx": ["这说明中文教育越来越受欢迎"]}, {"w": "教育", "py": "jiàoyù", "h": "教育", "kind": "word", "ctx": ["这说明中文教育越来越受欢迎"]}, {"w": "社会", "py": "shèhuì", "h": "社会", "kind": "word", "ctx": ["感谢广大家长和社会各界人士对中文学校的帮助"]}, {"w": "敬礼", "py": "jìnglǐ", "h": "敬礼", "kind": "word", "ctx": ["校长向台下鞠躬敬礼"]}, {"w": "讲话", "py": "jiǎnghuà", "h": "讲话", "kind": "word", "ctx": []}, {"w": "代表", "py": "dàibiǎo", "h": "代表", "kind": "word", "ctx": ["学生代表和家长代表先后发言"]}, {"w":  "同学们的笑声"]]], "events": ["一大早来到学校", "会场是什么样子", "校长讲了哪几件事", "老同学表演了什么", "典礼怎样结束"], "city": ["安阳", "商", "商朝后期的都城叫「殷」，甲骨文就是在这里出土的。"]}, {"n": 2, "t": "一堂有趣的中文课", "unit": 1, "text": ["今天上午，我们上了一堂有趣的中文课。", "上课铃响了，老师走上讲台，对我们说：“同学们，我们班三分之一的同学是新同学。今天，我们大家来自我介绍一下。每个同学介绍两分钟。”", "第一个发言的是赵龙同学。他面带微笑，走上讲台，在黑板上写下了“赵龙”两个字，然后对大家说：“我叫赵龙。爸爸、妈妈说我是龙年生的，是龙的传人，他们‘望子成龙’，所以给我取名叫‘赵龙’。我永远不会忘记自己是龙的传人。”", "“好！”同学们欢呼起来。教室里响起了一片掌声。", "第二个发言的是个个子瘦小的男同学。他一走上讲台，就向大家做了个鬼脸，又咳嗽了一声，这才不紧不慢地说：“我姓刘，是一头瘦小的牛。我一生下来就非常瘦小，所以爷爷给我取名叫‘小小’。后来爸爸、妈妈希望我健康成长，给我改名叫‘小康’。”他说完后伸了伸舌头，又做了个鬼脸。大家都哈哈大笑起来。", "轮到我了。我站起来，和妹妹手拉着手，心急地走上讲台。妹妹紧张极了，只好由我一个人来介绍：“我小名叫宝宝，大名叫周幸；她小名叫贝贝，大名叫周福。我们姐妹俩是双胞胎，小名合在一起是‘宝贝’，大名合在一起就是‘幸福’。祝愿老师和同学们永远幸福。”大家听了，热烈地鼓起掌来。", "同学们介绍完了之后，老师作了详细的课堂总结。下课铃响了，一堂有趣而有意义的课结束了。这堂课给我们留下了美好的回忆。"], "sections": [], "units": [{"w": "上课", "py": "shàngkè", "h": "上课", "kind": "word", "ctx": ["上课铃响了，老师走上讲台"]}, {"w": "自我", "py": "zìwǒ", "h": "自我", "kind": "word", "ctx": ["我们大家来自我介绍一下"]}, {"w": "黑板", "py": "hēibǎn", "h": "黑板", "kind": "word", "ctx": ["在黑板上写下了“赵龙”两个字"]}, {"w": "个子", "py": "gèzi", "h": "个子", "kind": "word", "ctx": ["第二个发言的是个个子瘦小的男同学"]}, {"w": "咳嗽", "py": "késou", "h": "咳嗽", "kind": "word", "ctx": ["又咳嗽了一声，这才不紧不慢地说"]}, {"w": "希望", "py": "xīwàng", "h": "希望", "kind": "word", "ctx": ["后来爸爸、妈妈希望我健康成长"]}, {"w": "成长", "py": "chéngzhǎng", "h": "成长", "kind": "word", "ctx": ["后来爸爸、妈妈希望我健康成长"]}, {"w": "舌头", "py": "shétou", "h": "舌头", "kind": "word", "ctx": ["他说完后伸了伸舌头"]}, {"w": "紧张", "py": "jǐnzhāng", "h": "紧张", "kind": "word", "ctx": ["妹妹紧张极了，只好由我一个人来介绍"]}, {"w": "幸福", "py": "xìngfú", "h": "幸福", "kind": "word", "ctx": ["大名合在一起就是‘幸福", "祝愿老师和同学们永远幸福"]}, {"w": "鼓掌", "py": "gǔzhǎng", "h": "鼓掌", "kind": "word", "ctx": []}, {"w": "总结", "py": "zǒngjié", "h": "总结", "kind": "word", "ctx": ["老师作了详细的课堂总结"]}, {"w": "下课", "py": "xiàkè", "h": "下课", "kind": "word", "ctx": ["下课铃响了，一堂有趣而有意义的课结束了"]}, {"w": "意义", "py": "yìyì", "h": "意义", "kind": "word", "ctx": ["一堂有趣而有意义的课结束了"]}, {"w": "回忆", "py": "huíyì", "h": "回忆", "kind": "word", "ctx": ["这堂课给 ，还有头发和眉毛，就是没有眼睛，老师说：“请同学们上来给它画上眼睛。”", "老师刚一讲完，同学们就纷纷举手，争着要去画。老师让小华先来。画之前，老师用一块黑布把小华的眼睛蒙上，又让他转了好几圈，然后才让他去画。小华伸出双手，摸摸这儿，摸摸那儿，好不容易走到黑板前，又上下左右地摸了摸，还是不知道该往哪儿画。他不管三七二十一，就在黑板上胡乱画了一双眼睛。等到解开大黑布一看，一只眼睛画到了眉毛上边，一只眼睛画在了脸外边，大家都不禁哈哈大笑起来。", "接着，老师又让方方去画。方方的眼睛也被黑布蒙上了，她也转了几个圈，才摸索着走到黑板前。她用笔在这儿点一点，在那儿点一点，也不知道该往哪儿画。这时，坐在下面的同学喊了起来，这个说：“向上点儿！”那个说：“不对！向下点儿！”还有人说：“向右点儿！”“再高点儿！”弄得方方不知听谁的好。她一赌气，就在黑板上画了一双三角眼。还没等她解开黑布，下面的同学就“哄”的一声大笑起来，有的还笑出了眼泪，原来方方把眼睛画到头发上了。", "这个游戏真有趣！"]}, "use": [["雨下了一整天，到了晚上＿＿没有停。", "仍然", ["同时", "准确", "全体"]], ["学校每年都会＿＿一次春游。", "组织", ["判断", "兴奋", "观众"]], ["明天就要去迪士尼了，弟弟＿＿得睡不着觉。", "兴奋", ["激烈", "准确", "精彩"]], ["他在学钢琴，＿＿也在学游泳。", "同时", ["仍然", "全体", "年级"]], ["裁判员看得很清楚，判断得非常＿＿。", "准确", ["兴奋", "激烈", "全体"]]], "link": [["＿＿是数学＿＿语文，他＿＿学得很认真。", "不管 / 还是 / 都", ["因为 / 所以 / 也", "虽然 / 但是 / 就", "如果 / 就 / 还"]], ["这场表演＿＿精彩＿＿！", "真是太 / 了", ["越来越 / 吗", "不管 / 都", "一边 / 一边"]], ["＿＿下雨＿＿下雪，他每天都去游泳训练。", "不管是 / 还是", ["因为是 / 所以", "虽然是 / 但是", "只要是 / 就"]]], "comp": [["这场篮球赛是谁和谁比？", "四年级对五年级", ["三年级对四年级", "男生对女生", "老师对学生"]], ["上半场比赛的结果是什么？", "打成了平局", ["我们队领先", "对方领先十分", "比赛暂停了"]], ["最后我们队是怎样赢的？", "以一分险胜对方", ["以十分大胜对方", "对方犯规被罚下", "对方提前认输"]], ["杰克远投成功，靠的是什么？", "全体队员的密切配合", ["裁判员的帮助", "观众的加油声", "对方的暂停"]]], "events": ["我是个球迷", "比赛开始，裁判员", "上半场打成平局", "三分球和杰克远投", "最后一分钟，一分险胜"], "city": ["长安", "汉·唐", "汉朝和唐朝的都城，丝绸之路从这里出发。"]}, {"n": 4, "t": "农夫和蛇", "unit": 2, "text": ["一年冬天，连续下了几场大雪，天气非常寒冷，河里结了一层厚厚的冰，泥土冻得硬硬的。", "有一位农夫清早出门，发现路边有一条冻僵了的蛇。他想把蛇捡起来救活它，忽然又想起蛇是会咬人的，就没有去救它。", "农夫一边走一边想：“蛇是会咬人的，可是，如果我救活了它，它总不会咬我吧？好心肯定有好报，我不能不救它。”于是，好心的农夫就转身往回走，来到蛇跟前，把它捡起来放进怀里，想用自己的体温使它醒过来。然后，农夫又继续赶路了。", "过了一会儿，农夫把蛇从怀里拿出来看了看，它虽然醒过来了，但是还不能动弹，农夫就又把它放进了怀里。", "在农夫温暖的怀里，蛇慢慢地能活动了。它觉得很舒服，动了动身子，张大嘴巴，吐了吐舌头，在农夫的胸口上狠狠地咬了一口。农夫忽然感到一阵剧痛。他连忙解开衣扣一看，原来是被蛇咬了一口。农夫气极了，抓起蛇，使劲把它摔在地上，又用脚一踩，蛇就死了。", "没多久，农夫觉得眼前的一切都变得模糊起来。他知道自己中了蛇毒，快不行了，就叹了口气，说：“看来蛇咬人的本性是不会改变的。对这样的坏东西，好心是没有用的。我真不该救它。”"], "sections": [], "units": [{"w": "寒冷", "py": "hánlěng", "h": "寒冷", "kind": "word", "ctx": ["天气非常寒冷，河里结了一层厚厚的冰"]}, {"w": "如果", "py": "rúguǒ", "h": "如果", "kind": "word", "ctx": ["如果我救活了 伤心，只好又去找神，请求神解除他的点金术。他说：“我如此喜欢金子，实在是太愚蠢了。你把我的金子全拿走，把我的女儿还给我吧！”", "神告诉他：“你到花园旁边的那条河里洗一洗手，点金术就可以消失了。”", "国王赶紧照着做了，然后飞快地跑到小女儿的金塑像前，亲了它一下。他漂亮的小女儿马上就活了。", "这次经历使国王终生难忘，他从此懂得了一个道理：只有金子，并不能给他带来幸福。"]}, "use": [["不知道该＿＿回答老师的问题，他急得脸都红了。", "如何", ["尽管", "到底", "坚持"]], ["游泳训练很累，可是他一直＿＿着，从来不缺席。", "坚持", ["矛盾", "如何", "到底"]], ["你一会儿说喜欢，一会儿又说不喜欢，这不是自相＿＿吗？", "矛盾", ["奋斗", "到底", "女儿"]], ["你＿＿想吃什么？快决定吧。", "到底", ["如何", "尽管", "坚持"]], ["＿＿天气很冷，他还是去晨跑了。", "尽管", ["如何", "到底", "坚持"]]], "link": [["＿＿下着大雨，他＿＿准时到了学校。", "尽管 / 还是", ["因为 / 所以", "不管 / 都", "一边 / 一边"]], ["今天我＿＿把这道难题做出来＿＿！", "非 / 不可", ["一点儿 / 也", "越来越 / 了", "一边 / 一边"]], ["精卫＿＿地从山上衔来石子。", "一次又一次", ["一点儿也", "越来越", "一边"]]], "comp": [["卖兵器的人说他的矛怎么样？", "天下最锋利，什么都挡不住", ["天下最便宜", "天下最长", "是皇帝用过的"]], ["士兵的问题为什么让卖兵器的人答不上来？", "他前后说的话自相矛盾", ["士兵说话太快了", "他听不懂士兵的话", "他的盾已经卖掉了"]], ["精卫是谁变的？", "炎帝的女儿", ["一位渔夫", "炎帝的儿子", "一只海鸟的妈妈"]], ["“精卫填海”现在用来表示什么？", "不怕艰难、坚持到底的决心", ["大海很危险", "小鸟很可爱", "做事要先想好再做"]]], "events": ["自相矛盾：卖矛、卖盾", "士兵问了什么", "精卫填海：炎帝的女儿", "衔石子和树枝", "这个成语表示什么"], "city": ["邺城", "三国", "曹操的大本营，铜雀台就建在这里。"]}, {"n": 7, "t": "珠穆朗玛峰", "unit": 3, "text": ["在中国西南部的青藏高原上，耸立着世界第一高峰——珠穆朗玛峰。它海拔8844.43米。", "珠穆朗玛峰是一座冰峰，山势雄伟挺拔，风光十分迷人。太阳出来的时候，峰顶洁白纯净，银光闪闪，格外夺目；刮风下雪的时候，峰顶飘动着层层云雾，使人感到神秘莫测。一天之内，它气象万千，变幻无穷，美丽而又神奇。", "珠穆朗玛峰有个动人的传说。相传在中国的西藏有一个美丽的女神，名叫珠穆朗玛。她既聪明又温和，还乐于助人，因此，受到了人们的尊敬和爱戴。一天，她骑马来到这座高高的雪峰下，美丽而又神奇的雪峰把她吸引住了，她就在这里住了下来。不久，这个消息在藏族同胞中间传开了。人们不仅喜欢珠穆朗玛，而且向往她居住的地方，于是纷纷从各地搬到珠穆朗玛居住的雪峰下，修寺庙，建房屋，种粮食，放牛羊，在这里建设幸福的家园。从此，这座高高的山峰就被称作“珠穆朗玛峰”。美丽的传说，表达了藏族同胞对西藏大好河山的热爱。", "雄伟壮丽的珠穆朗玛峰吸引着世界各国无数的探险家和登山队员。人们把登上“珠峰”作为人类征服自然的象征。自从19世纪20年代以来，很多国家派人来这里探险、登山。1953年，人们首次从南坡登上“珠峰”，翻开了世界登山史新的一页。1960年，中国登山运动员又成功地从北坡登上了峰顶，结束了无人从北坡征服世界最高峰的历史，创造了新的登山纪录。"], "sections": [], "units": [{"w": "西南", "py": "xīnán", "h": "西南", "kind": "word", "ctx": ["在中国西南部的青藏高原上"]}, {"w": "高原", "py": "gāoyuán", "h": "高原", "kind": "word", "ctx": ["在中国西南部的青藏高原上"]}, {"w": "尊敬", "py": "zūnjìng", "h": "尊敬", "kind": "word", "ctx": ["受到了人们的尊敬和爱戴"]}, {"w": "不仅", "py": "bùjǐn", "h": "不仅", "kind": "word", "ctx": ["人们不仅喜欢珠穆朗玛"]}, 大火很快就熄灭了。不久，冰雪封顶，这座山就成了一座雪山。", "银白色的雪山纯洁而明亮，人们把它叫作“光辉之山”。那是赤道太阳下的冰雪银光！而山脚下又是另一种景象：到处是大片大片的原始森林，林间的山坡上还种有咖啡、香蕉和茶树。山上是洁白的冰雪，山下是绿色的森林，这种奇特的景象吸引着世界各国的众多游客前来参观。"]}, "use": [["下课铃一响，同学们＿＿跑到操场上。", "纷纷", ["不仅", "自从", "以来"]], ["＿＿搬到加州，我们每个周末都去海边。", "自从", ["纷纷", "不仅", "以来"]], ["他用一幅画来＿＿自己对妈妈的爱。", "表达", ["尊敬", "纷纷", "人类"]], ["我们要＿＿老师，上课认真听讲。", "尊敬", ["表达", "纷纷", "以来"]], ["他＿＿会游泳，还会打篮球。", "不仅", ["纷纷", "自从", "尊敬"]]], "link": [["珠穆朗玛＿＿聪明＿＿温和。", "既 / 又", ["一边 / 一边", "不管 / 都", "非 / 不可"]], ["人们＿＿喜欢珠穆朗玛，＿＿向往她居住的地方。", "不仅 / 而且", ["非 / 不可", "一点儿 / 也", "越来越 / 了"]], ["峰顶飘动着层层云雾，＿＿人感到神秘莫测。", "使", ["被", "把", "对"]]], "comp": [["珠穆朗玛峰在什么地方？", "中国西南部的青藏高原上", ["中国东北部的平原上", "非洲的赤道附近", "法国巴黎"]], ["刮风下雪的时候，峰顶是什么样子？", "飘动着层层云雾，神秘莫测", ["洁白纯净，银光闪闪", "开满了鲜花", "和平时一模一样"]], ["传说中，人们为什么搬到雪峰下？", "他们喜欢珠穆朗玛，向往她住的地方", ["雪峰下很暖和", "那里有很多金子", "国王命令他们搬去"]], ["1960 年发生了什么？", "中国登山运动员从北坡登上了峰顶", ["人们第一次从南坡登上珠峰", "珠峰长高了", "女神珠穆朗玛来到雪峰下"]]], "events": ["在哪里，有多高", "晴天和风雪天的样子", "女神珠穆朗玛的传说", "1953 年和 1960 年"], "city": ["成都", "蜀汉", "三国时刘备建立蜀汉，都城就在这里。"]}, {"n": 8, "t": "蝙蝠和雷达", "unit": 3, "text": ["飞机为什么在夜里能安全飞行呢？原来是人们从蝙蝠身上得到了启示，给飞机装上了雷达。", "蝙蝠通常是在夜间飞行的。它无论怎样飞，都不会撞上什么东西；即使一根很细的电线，它也能避开。这是什么原因呢？", "为了弄清这个问题，一百多年前，科学家做过一次试验。他们在一间黑屋子里拉了许多绳子，绳子上系了许多铃。然后，他们把蝙蝠的眼睛蒙上，让它在屋子里飞。飞了几个钟头，它一个铃也没碰响。接着，科学家又做了两次试验。一次把蝙蝠的耳朵堵上，一次把蝙蝠的嘴封住，让它在黑屋子里飞。在这两次试验中，蝙蝠到处乱撞，铃不断地响起来。", "试验证明，蝙蝠夜间飞行，探路的工具不是眼睛，而是嘴和耳朵。", "经过反复研究，这个秘密揭开了。蝙蝠在空中飞行，一边飞一边从嘴里发出一种声音。这种声音叫做“超声波”，人的耳朵听不见，蝙蝠的耳朵却听得见。超声波像波浪一样向前推进，遇到障碍物反射回来，蝙蝠的耳朵就听到了。蝙蝠就是用嘴和耳朵探路飞行的。", "飞机上的雷达就相当于蝙蝠的嘴和耳朵。雷达通过天线，发出无线电波。遇到障碍物，无线电波就反射回来，显示在荧光屏上。有了雷达，飞行员就能驾驶飞机在夜间安全飞行了。"], "sections": [], "units": [{"w": "原因", "py": "yuányīn", "h": "原因", "kind": "word", "ctx": ["它也能避开，这是什么原因呢"]}, {"w": "钟头", "py": "zhōngtóu", "h": "钟头", "kind": "word", "ctx": ["飞了几个钟头，它一个铃也没碰响"]}, {"w": "证明", "py": "zhèngmíng", "h": "证明", "kind": "word", "ctx": ["试验证明，蝙蝠夜间飞行"]}, {"w": "工具", "py": "gōngjù", "h": "工具", "kind": "word", "ctx": ["探路的工具不是眼睛"]}, {"w": "反复", "py": "fǎnfù", "h": "反复", "kind": "word", "ctx": ["经过反复研究，这个秘密揭开了"]}, {"w": "秘密", "py": "mìmì", "h": "秘密", "kind": "word", "ctx": ["这个秘密揭开了，蝙蝠在空中飞行", "经过反复研究，这个秘密揭开了"]}, {"w": "波浪", "py": "bōlàng", "h": "波浪", "kind": "word", "ctx": ["超声波像波浪一样向前推进"]}, {"w": "相当", "py": "xiāngdāng", "h": "相当", "kind": "word", "ctx": ["飞机上的雷达就相当于蝙蝠的嘴和耳朵"]}, {"w": "启", "py": "qǐ", "h": "启示", "kind": "char", "ctx": ["原来是人们从蝙蝠身上得到了启示"]}, {"w": "避", "py": "bì", "h": "避开", "kind": "char", "ctx": ["它也能避开，这是什么原因呢"]}, {"w": "绳", "py": "shéng", "h": "绳子", "kind": "char", "ctx": ["他们在一间黑屋子里拉了许多绳子", "绳子上系了许多铃"]}, {"w": "系", "py": "jì", "h": "系了许多铃", "kind": "char", "ctx": ["绳子上系了许多铃"]}, {"w": "蒙", "py": "méng", "h": "蒙上", "kind": "char", "ctx": ["他们把蝙蝠的眼睛蒙上"]}, {"w": "堵", "py": "dǔ", "h": "堵上", "kind": "char", "ctx": ["一次把蝙蝠的耳朵堵上"]}, {"w": "乱", "py": "luàn", "h": "乱撞", "kind": "char", "ctx": ["蝙蝠到处乱撞，铃不断地响起来"]}, {"w": "揭", "py": "jiē", "h": "揭开", "kind": "char", "ctx": ["这个秘密揭开了，蝙蝠在空中飞行", "经过反复研究，这个秘密揭开了"]}, {"w": "推", "py": "tuī", "h": "推进", "kind": "char", "ctx": ["超声波像波浪一样向前推进"]}, {"w": "障", "py": "zhàng", "h": "障碍", "kind": "char", "ctx": ["遇到障碍物反射回来", "遇到障碍物，无线电波就反射回来"]}, {"w": "碍", "py": "ài", "h": "障碍", "kind": "char", "ctx": ["遇到障碍物反射回来", "遇到障碍物，无线电波就反射回来"]}, {"w": "驾", "py": "jià", "h": "驾驶", "kind": "char", "ctx": ["飞行员就能驾驶飞机在夜间安全飞行了"]}, {"w": "驶", "py": "shǐ", "h": "驾驶", "kind": "char", "ctx": ["飞行员就能驾驶飞机在夜间安全飞行了"]}], "order": [{"s": "经过反复研究，这个秘密揭开了。", "c": ["经过", "反复研究，", "这个秘密", "揭开了。"]}], "cues": ["飞机夜里怎么安全飞", "三次试验", "超声波的秘密", "雷达和蝙蝠一样"], "reading": {"title": "活字印刷术", "text": ["活字印刷术是中国古代四大发明之一。", "宋朝时，有个印刷工人叫毕昇。他既会刻字，又会印刷，技艺出众。那时候，刻板印刷成本很高，每印一种书，都要刻一次板；印完之后，这些刻板就不能再用来印其他书了。毕昇想，要是能把一个一个的字分别刻在一块块小木头上，然后再拼起来印书，用完后拆散，这些字以后不就可以用来再印其他书了吗？于是，他就试着用这个方法刻字制版印刷，结果发现木头不够坚硬，用不了几次就坏了。怎么办呢？毕昇一时也想不出其他办法来。", "有一天，毕昇看见几个孩子在玩色子。他走过去看了看，发现这种色子非常坚硬。一个孩子告诉他，色子是用泥做的，经过了火烧，所以很坚硬。毕昇由此受到启发，他想，能不能把字刻在泥块上呢？", "他一回到家，就马上取来泥，用水和好，做成一个个小方块，再让风吹干，然后刻上字，放到火里烧上一段时间。当这些小方块被取出来时，它们已经像瓷一样坚硬耐用了。", "毕昇把这个办法告诉了其他印刷工人。他们一起做了许多“活字”，用来制版印刷，效果果然很好。这些方块字拆下来后，还可以重复使用。", "经过多次试验，毕昇终于发明了“活字印刷术”。后来，活字印刷术传到了欧洲，又传遍了全世界。"]}, "use": [["他迟到的＿＿是路上堵车了。", "原因", ["秘密", "工具", "证明"]], ["做完题要＿＿检查几遍，才不会出错。", "反复", ["相当", "证明", "波浪"]], ["剪刀、尺子都是做手工的＿＿。", "工具", ["原因", "钟头", "秘密"]], ["这次的好成绩＿＿了他的努力没有白费。", "证明", ["反复", "相当", "原因"]], ["这是我们两个人的＿＿，不能告诉别人。", "秘密", ["原因", "工具", "波浪"]]], "link": [["＿＿明天下大雨，比赛＿＿照常进行。", "即使 / 也", ["因为 / 所以", "虽然 / 但是", "一边 / 一边"]], ["蝙蝠探路靠的＿＿眼睛，＿＿嘴和耳朵。", "不是 / 而是", ["一边 / 一边", "越来越 / 了", "不仅 / 而且"]], ["＿＿你问他什么，他＿＿笑着回答。", "无论 / 都", ["因为 / 所以", "虽然 / 但是", "非 / 不可"]]], "comp": [["科学家把蝙蝠的眼睛蒙上以后，发生了什么？", "它飞了几个钟头，一个铃也没碰响", ["它到处乱撞", "它飞不起来了", "铃一直在响"]], ["蝙蝠夜里飞行靠什么探路？", "嘴和耳朵", ["眼睛", "翅膀", "鼻子"]], ["“超声波”是什么？", "蝙蝠嘴里发出的、人听不见的声音", ["雷达发出的光", "飞机发出的声音", "铃铛的响声"]], ["飞机上的雷达相当于蝙蝠的什么？", "嘴和耳朵", ["眼睛", "翅膀", "脚"]]], "events": ["飞机夜里怎么安全飞", "三次试验", "超声波的秘密", "雷达和蝙蝠一样"], "city": ["建康", "东晋·南朝", "东晋和南朝的都城，就是今天的南京。"]}, {"n": 9, "t": "古诗二首", "unit": 3, "text": ["清明时节雨纷纷，", "路上行人欲断魂。", "借问酒家何处有，", "牧童遥指杏花村。", "月落乌啼霜满天，", "江枫渔火对愁眠。", "姑苏城外寒山寺，", "夜半钟声到客船。"], "sections": [{"title": "清明", "author": "（唐）杜牧", "text": ["清明时节雨纷纷，", "路上行人欲断魂。", "借问酒家何处有，", "牧童遥指杏花村。"]}, {"title": "枫桥夜泊", "author": "（唐）张继", "text": ["月落乌啼霜满天，", "江枫渔火对愁眠。", "姑苏城外寒山寺，", "夜半钟声到客船。"]}], "units": [{"w": "唐", "py": "táng", "h": "唐朝", "kind": "char", "ctx": []}, {"w": "杜", "py": "dù", "h": "杜牧", "kind": "char", "ctx": []}, {"w": "牧", "py": "mù", "h": "牧童", "kind": "char", "ctx": ["牧童遥指杏花村"]}, {"w": "欲", "py": "yù", "h": "欲断魂", "kind": "char", "ctx": ["路上行人欲断魂"]}, {"w": "魂", "py": "hún", "h": "断魂", "kind": "char", "ctx": ["路上行人欲断魂"]}, {"w": "枫", "py": "fēng", "h": "枫桥", "kind": "char", "ctx": ["江枫渔火对愁眠"]}, {"w": "泊", "py": "bó", "h": "枫桥夜泊", "kind": "char", "ctx": []}, {"w": "霜", "py": "shuāng", "h": "霜满天", "kind": "char", "ctx": ["月落乌啼霜满天"]}, {"w": "渔", "py": "yú", "h": "渔火", "kind": "char", "ctx": ["江枫渔火对愁眠"]}, {"w": "愁", "py": "chóu", "h": "愁眠", "kind": "char", "ctx": ["江枫渔火对愁眠"]}, {"w": "苏", "py": "sū", "h": "姑苏", "kind": "char", "ctx": ["姑苏城外寒山寺"]}, {"w": "寺", "py": "sì", "h": "寒山寺", "kind": "char", "ctx": ["姑苏城外寒山寺"]}], "order": [{"s": "清明时节雨纷纷，路上行人欲断魂。借问酒家何处有，牧童遥指杏花村。", "c": ["清明时节雨纷纷，", "路上行人欲断魂。", "借问酒家何处有，", "牧童遥指杏花村。"], "title": "清明"}, {"s": "月落乌啼霜满天，江枫渔火对愁眠。姑苏城外寒山寺，夜半钟声到客船。", "c": ["月落乌啼霜满天，", "江枫渔火对愁眠。", "姑苏城外寒山寺，", "夜半钟声到客船。"], "title": "枫桥夜泊"}], "cues": ["背《清明》", "背《枫桥夜泊》", "两首诗分别写了什么时候、什么地方"], "reading": {"title": "诗曲二首", "text": ["故人西辞黄鹤楼，烟花三月下扬州。", "孤帆远影碧空尽，惟见长江天际流。", "枯藤老树昏鸦，小桥流水人家，古道西风瘦马。", "夕阳西下，断肠人在天涯。"]}, "use": [], "link": [], "comp": [["《清明》写的是什么节日？", "清明节", ["中秋节", "春节", "端午节"]], ["《清明》的作者是谁？", "杜牧", ["张继", "李白", "马致远"]], ["《枫桥夜泊》里，诗人晚上在哪里？", "停在枫桥边的船上", ["寒山寺里", "姑苏城的家里", "杏花村"]], ["半夜，诗人听到了什么声音？", "寒山寺的钟声", ["牧童的笛声", "下雨的声音", "酒家的叫卖声"]]], "events": [], "city": ["平城", "北魏", "北魏早期的都城，就是今天的大同，城外有云冈石窟。"]}, {"n": 10, "t": "徐悲鸿的故事", "unit": 4, "text": ["20世纪20年代，在法国巴黎的卢浮宫里，人们常常可以看见一位中国青年在那里刻苦地临摹油画。有时他一画就是十几个小时。这位勤奋的中国青年，就是徐悲鸿。", "徐悲鸿从小就非常喜欢美术，九岁开始跟父亲学中国画，这为他以后的创作打下了扎实的基础。有一次，父亲的一个朋友从法国回来，带来了巴黎卢浮宫的许多名画复制品。徐悲鸿被这些名画深深地吸引住了，他盼望能早日去巴黎亲眼看看这些名画。", "1919年，徐悲鸿的愿望终于实现了。他来到法国巴黎的卢浮宫，这里的艺术品使他着了迷。他白天或者去学校上课，或者去博物馆临摹名画，晚上就在自己的房间里进行创作。他经过刻苦练习，后来成了闻名中外的大画家。", "徐悲鸿爱画动物，尤其爱画马。他画的《奔马图》，是中国画中的名作。站在这幅画前，人们看着飞奔的马，就好像听到了马蹄声。他画的马为什么这样逼真呢？这是因为他除了多年坚持练习绘画技巧之外，还非常注意观察马的生活，研究马的习性。除了喜欢画马之外，他还喜欢画狮子。为了画好狮子，他曾用了三个月的时间，每天去动物园观察狮子，一边观察一边画。他无论画马，还是画狮子，都画得那么逼真，那么传神！", "徐悲鸿以优秀的作品闻名于世，他不愧是一位伟大的画家。"], "sections": [], "units": [{"w": "基础", "py": "jīchǔ", "h": "基础", "kind": "word", "ctx": ["这为他以后的创作打下了扎实的基础"]}, {"w": "优秀", "py": "yōuxiù", "h": "优秀", "kind": "word", "ctx": ["徐悲鸿以优秀的作品闻名于世"]}, {"w": "博", "py": "bó", "h": "博物馆", "kind": "char", "ctx": ["或者去博物馆临摹名画"]}, {"w": "奔", "py": "bēn", "h": "奔马", "kind": "char", "ctx": ["他画的《奔马图》", "人们看着飞奔的马"]}, {"w": "幅", "py": "fú", "h": "这幅画", "kind": "char", "ctx": ["站在这幅画前，人们看着飞奔的马"]}, {"w": "蹄", "py": "tí", "h": "马蹄", "kind": "char", "ctx": ["就好像听到了马蹄声"]}, {"w": "逼", "py": "bī", "h": "逼真", "kind": "char", "ctx": ["他画的马为什么这样逼真呢", "都画得那么逼真，那么传神"]}, {"w": "巧", "py": "qiǎo", "h": "技巧", "kind": "char", "ctx": ["这是因为他除了多年坚持练习绘画技巧之外"]}, {"w": "曾", "py": "céng", "h": "他曾用了三个月", "kind": "char", "ctx": ["他曾用了三个月的时间"]}, {"w": "愧", "py": "kuì", "h": "不愧", "kind": "char", "ctx": ["他不愧是一位伟大的画家"]}], "order": [{"s": "他白天或者去学校上课，或者去博物馆临摹名画。", "c": ["他白天", "或者去", "学校上课，", "或者去", "博物馆", "临摹名画。"]}, {"s": "他无论画马，还是画狮子，都画得那么逼真，那么传神！", "c": ["他无论画马，", "还是画狮子，", "都画得", "那么逼真，", "那么传神！"]}], "cues": ["卢浮宫里的中国青年", "九岁学画，盼望去巴黎", "1919 年到巴黎刻苦学习", "画马、画狮子为什么逼真"], "reading": {"title": "最后一片藤叶", "text": ["玛丽和苏爱是两个年轻的穷画家，她们住在一所旧公寓里。一年冬天，玛丽不幸得了肺炎。", "一天，医生给玛丽看完病，走出来对苏爱说：“要治好她的病，只有十分之一的希望了，关键是看她有没有活下去的信心，因为药物对她已经没有多大作用了。”", "医生走后，苏爱偷偷地哭了。过了一会儿，苏爱走进玛丽的房间，一边画画儿，一边照看玛丽。忽然，苏爱听到玛丽在说什么。她来到玛丽床前，看见玛丽望着窗外，嘴里正数着：“10、9、8、7……”苏爱向窗外望去，窗外只有一个空院子，院子对面是一面墙，墙上爬满了常春藤，藤上的叶子几乎都被寒风刮掉了。", "“亲爱的，怎么啦？”苏爱关切地问。", "“叶子，常春藤的叶子，现在只剩下最后五片了。等最后一片叶子掉下来，我也就死了。”玛丽伤感地说。", "“别说傻话了！”苏爱说，“藤叶跟你的病有什么关系呢？医生说，你很快就会好的。”", "那天晚上，刮了一夜的风，下了一夜的雨。第二天早上，苏爱按照玛丽的要求打开了窗子。经过一夜的风雨，院子对面的墙上还留着一片叶子，那是最后的一片叶子了。几天过去了，无论寒风怎么吹，那片叶子一直没有掉下来。这片叶子给了玛丽活下去的信心和希望。", "又过了几天，玛丽已经没有什么危险了。苏爱对玛丽说：“告诉你一个不幸的消息，我们楼下的老画家贝尔门先生得肺炎死了。那常春藤的最后一片叶子无论怎样被风吹雨打，都没掉下来，你不感到奇怪吗？因为那是贝尔门先生的杰作——那天夜里，最后的那片叶子掉下来后，是贝尔门先生在风雨中又把它画到墙上去的。也就是在那天夜里，他得了感冒，并引起了肺炎，不幸去世了。”", "玛丽听了，感动得流下了热泪。"]}, "use": [["他每天练琴三个小时，学得非常＿＿。", "刻苦", ["逼真", "基础", "不愧"]], ["这幅画上的马画得太＿＿了，好像要跑出来一样。", "逼真", ["刻苦", "基础", "盼望"]], ["打好＿＿，以后学什么都会容易一些。", "基础", ["优秀", "逼真", "盼望"]], ["他门门功课都很＿＿，大家都向他学习。", "优秀", ["逼真", "基础", "盼望"]], ["他是游泳队最快的队员，＿＿是“小飞鱼”。", "不愧", ["盼望", "刻苦", "基础"]]], "link": [["周末他＿＿去游泳，＿＿去打篮球，不会两样都去。", "或者 / 或者", ["因为 / 所以", "非 / 不可", "一点儿 / 也"]], ["＿＿画马，＿＿画狮子，他＿＿画得那么逼真。", "无论 / 还是 / 都", ["因为 / 所以 / 也", "虽然 / 但是 / 就", "一边 / 一边 / 就"]], ["＿＿喜欢画马＿＿，他还喜欢画狮子。", "除了 / 之外", ["因为 / 所以", "如果 / 就", "虽然 / 但是"]]], "comp": [["徐悲鸿几岁开始跟父亲学画？", "九岁", ["五岁", "十二岁", "十九岁"]], ["徐悲鸿在巴黎的卢浮宫里做什么？", "刻苦地临摹油画", ["卖自己的画", "当导游", "学做菜"]], ["徐悲鸿尤其爱画什么？", "马", ["狮子", "花鸟", "山水"]], ["他画的马为什么那么逼真？", "坚持练习技巧，还认真观察马的生活和习性", ["他家里养了很多马", "他照着照片画", "他画得非常快"]]], "events": ["卢浮宫里的中国青年", "九岁学画，盼望去巴黎", "1919 年到巴黎刻苦学习", "画马、画狮子为什么逼真"], "city": ["逻些", "吐蕃", "吐蕃的都城，就是今天的拉萨；唐朝的文成公主远嫁到这里。"]}, {"n": 11, "t": "郑和远航", "unit": 4, "text": ["郑和是中国古代著名的航海家。从1405年到1431年，他率领船队七次远渡重洋，到过东南亚一些国家和印度，最远到过波斯湾和非洲东海岸的许多国家。", "郑和带领的船队是当时世界上最大的船队。每次远航的船队，都由六十多艘“宝船”组成。有的“宝船”很大，长146米，宽60米，可以装下几千吨货物，同时还可以乘坐上千人。每次远航的船队有船员两万多人，其中有水手、医生、工人，还有骑兵和战马。", "1405年6月，郑和第一次远航时，苏州的百姓都到江边来看船队出海。62艘“宝船”披红挂彩，在江面一字排开。在礼炮声中，“宝船”乘风破浪，驶向大海。船队经过中国南海，穿过马六甲海峡，绕过印度半岛，访问了二十多个国家。在远航中，哪怕风浪再大，他们都能战胜困难，一往无前。这次远航历时两年多。他们于1407年金秋时节胜利返回了苏州。", "郑和远航，把中国人民的友好情谊以及中国的丝绸、火药和造纸术等带到了海外；同时，也带回了外国朋友赠送的礼品，从而促进了中外文化交流，使当时的中国受到了外国朋友的敬仰。", "郑和七次远航，创造了世界航海史上的奇迹。他的伟大业绩远远超过了当时欧洲最著名的航海家。"], "sections": [], "units": [{"w": "率领", "py": "shuàilǐng", "h": "率领", "kind": "word", "ctx": ["他率领船队七次远渡重洋"]}, {"w": "哪怕", "py": "nǎpà", "h": "哪怕", "kind": "word", "ctx": ["哪怕风浪再大，他们都能战胜困难"]}, {"w": "友好", "py": "yǒuhǎo", "h": "友好", "kind": "word", "ctx": ["把中国人民的友好情谊以及中国的丝绸、火药和造纸术等带到了海外"]}, {"w": "以及", "py": "yǐjí", "h": "以及", "kind": "word", "ctx": ["把中国人民的友好情谊以及中国的丝绸、火药和造纸术等带到了海外"]}, {"w": "从而", "py": "cóngér", "h": "从而", "kind": "word", "ctx": ["从而促进了中外文化交流"]}, {"w": "促进", "py": "cùjìn", "h": "促进", "kind": "word", "ctx": ["从而促进了中外文化交流"]}, {"w": "文化", "py": "wénhuà", "h": "文化", "kind": "word", "ctx": ["从而促进了中外文化交流"]}, {"w": "交流", "py": "jiāoliú", "h": "交流", "kind": "word", "ctx": ["从而促进了中外文化交流"]}, {"w": "渡", "py": "dù", "h": "远渡重洋", "kind": "char", "ctx": ["他率领船队七次远渡重洋"]}, {"w": "洲", "py": "zhōu", "h": "非洲", "kind": "char", "ctx": ["最远到过波斯湾和非洲东海岸的许多国家", "他的伟大业绩远远超过了当时欧洲最著名的航海家"]}, {"w": "艘", "py": "sōu", "h": "六十多艘", "kind": "char", "ctx": ["都由六十多艘“宝船”组成", "62艘“宝船”披红挂彩"]}, {"w": "吨", "py": "dūn", "h": "几千吨", "kind": "char", "ctx": ["可以装下几千吨货物"]}, {"w": "货", "py": "huò", "h": "货物", "kind": "char", "ctx": ["可以装下几千吨货物"]}, {"w": "乘", "py": "chéng", "h": "乘坐", "kind": "char", "ctx": ["同时还可以乘坐上千人", "宝船”乘风破浪，驶向大海"]}, {"w": "披", "py": "pī", "h": "披红挂彩", "kind": "char", "ctx": ["62艘“宝船”披红挂彩"]}, {"w": "绕", "py": "rào", "h": "绕过", "kind": "char", "ctx": ["绕过印度半岛，访问了二十多个国家"]}, {"w": "访", "py": "fǎng", "h": "访问", "kind": "char", "ctx": ["访问了二十多个国家"]}, {" 是一位医生、诗人和动物学家。他的父亲是当地一位很有名的医生。", "他们家门前有一个很大的花园。花园里果树成行，鲜花盛开，十分惹人喜爱。达尔文的妈妈喜欢种花。夏天的夜晚，达尔文常常跟妈妈在一起，专心听妈妈讲述种花的知识。", "有一次，达尔文看到花园里的玫瑰花开了，就伸手去摘，哪知道花没摘到，手倒被刺破了。他赶快去找妈妈。妈妈一边给他挑手上的刺，一边对他说：“玫瑰花是好看，不过有刺。一不小心就会被它刺伤，以后你不要再去摘它了。”接着，妈妈又给达尔文讲了许多关于花的知识。达尔文听了，连连点头。", "花园里还有很多小鸟和昆虫，达尔文很喜欢这些小生物。他收集了各种各样的标本，有惹人喜爱的鸟蛋、色彩艳丽的大小蝴蝶和各种小甲虫。上小学的时候，达尔文的口袋里、书包里总是装满了各种各样的石头和动植物标本。他不仅爱收集动植物标本，还阅读了许多描写动植物的书。他边看书边做记号，碰到不懂的地方就向人请教。", "达尔文经过二十多年的刻苦钻研，揭开了物种起源的奥秘，发现了生物进化的规律，写出了一本科学巨著——《物种起源》。"], "sections": [], "units": [{"w": "当地", "py": "dāngdì", "h": "当地", "kind": "word", "ctx": ["他的父亲是当地一位很有名的医生"]}, {"w": "不过", "py": "búguò", "h": "不过", "kind": "word", "ctx": ["不过有刺，一不小心就会被它刺伤", "玫瑰花是好看，不过有刺"]}, {"w": "生物", "py": "shēngwù", "h": "生物", "kind": "word", "ctx": ["达尔文很喜欢这些小生物", "发现了生物进化的规律"]}, {"w": "阅读", "py": "yuèdú", "h": "阅读", "kind": "word", "ctx": ["还阅读了许多描写动植物的书"]}, {"w": "描写", "py": "miáoxiě", "h": "描写", "kind": "word", "ctx": ["还阅读了许多描写动植物的书"]}, {"w": "钻研", "py": "zuānyán", "h": "钻研", "kind": "word", "ctx": ["达尔文经过二十多年的刻苦钻研"]}, {"w": "进化", "py": "jìnhuà", "h": "进化", "kind": "word", "ctx": ["发现了生物进化的规律"]}, {"w": "规律", "py": "guīlǜ", "h": "规律", "kind": "word", "ctx": ["发现了生物进化的规律"]}, {"w": "科学", "py": "kēxué", "h": "科学", "kind": "word", "ctx": ["写出了一本科学巨著——《物种起源》"]}, {"w": "尔", "py": "ěr", "h": "达尔文", "kind": "char", "ctx": ["达尔文出生在英国", "达尔文的妈妈喜欢种花", "达尔文常常跟妈妈在一起"]}, {"w": "盛", "py": "shèng", "h": "盛开", "kind": "char", "ctx": ["鲜花盛开，十分惹人喜爱"]}, {"w": "惹", "py": "rě", "h": "惹人喜爱", "kind": "char", "ctx": ["十分惹人喜爱，达尔文的妈妈喜欢种花", "有惹人喜爱的鸟蛋、色彩艳丽的大小蝴蝶和各种小甲虫"]}, {"w": "述", "py": "shù", "h": "讲述", "kind": "char", "ctx": ["专心听妈妈讲述种花的知识"]}, {"w": "蝴", "py": "hú", "h": "蝴蝶", "kind": "char", "ctx": ["有惹人喜爱的鸟蛋、色彩艳丽的大小蝴蝶和各种小甲虫"]}, {"w": "蝶", "py": "dié", "h": "蝴蝶", "kind": "char", "ctx": ["有惹人喜爱的鸟蛋、色彩艳丽的大小蝴蝶和各种小甲虫"]}, {"w": "甲", "py": "jiǎ", "h": "甲虫", "kind": "char", "ctx": ["有惹人喜爱的鸟蛋、色彩艳丽的大小蝴蝶和各种小甲虫"]}, {"w": "植", "py": "zhí", "h": "植物", "kind": "char", "ctx": ["达尔文的口袋里、书包里总是装满了各种各样的石头和动植物标本", "他不仅爱收集动植物标本", "还阅读 /* ---------- item builders ---------- */
function distract(u,m){const ok=x=>x.k!==u.k&&x.w!==u.w&&x.py!==u.py&&!x.w.includes(u.w)&&!u.w.includes(x.w);
  let own=shuffle(L[u.n].units.filter(x=>ok(x)&&x.kind===u.kind)).sort((a,b)=>Math.abs(a.w.length-u.w.length)-Math.abs(b.w.length-u.w.length)).slice(0,m);
  if(own.length<m)own=own.concat(shuffle(Object.values(U).filter(x=>ok(x)&&x.n!==u.n&&x.kind===u.kind&&x.w.length===u.w.length&&!own.includes(x))).slice(0,m-own.length));
  return own.map(x=>x.k)}
function item(type,k){const u=U[k];if(!u)return null;
  if(type==='fill'){if(!u.ctx.length)return null;return{k,type,ctx:u.ctx[Math.random()*u.ctx.length|0],opts:shuffle([k,...distract(u,3)])}}
  if(type==='listen'||type==='py')return{k,type,opts:shuffle([k,...distract(u,3)])};
  if(type==='write'||type==='pyw')return{k,type};return null}
function qSteps(keys,types,tag){const g={};let i=0;
  keys.forEach(k=>{for(let t=0;t<types.length;t++){const ty=types[(i+t)%types.length],it=item(ty,k);if(it){(g[ty]=g[ty]||[]).push(it);break}}i++});
  return['listen','py','fill','pyw','write'].filter(t=>g[t]).map(t=>({type:t,items:g[t],pos:0,ans:[],tag}))}
function orderStep(keys,tag){const items=keys.filter(k=>SK[k]).map(k=>({k,chunks:SK[k].c,sh:shuffle(SK[k].c.map((c,i)=>i)),picked:[]}));return items.length?{type:'order',items,pos:0,ans:[],tag}:null}
function qkSteps(keys,tag,lost){const g={};keys.filter(k=>QK[k]).forEach(k=>(g[QK[k].type]=g[QK[k].type]||[]).push({k,opts:shuffle([QK[k].a,...QK[k].o])}));
  return['use','link','comp'].filter(t=>g[t]).map(t=>({type:t,items:g[t],pos:0,ans:[],tag,lost}))}
const lessonQ=(n,t)=>Object.keys(QK).filter(k=>QK[k].n===n&&(!t||QK[k].type===t));
function polyStep(keys,tag){const items=keys.filter(k=>PK[k]).map(k=>({k,opts:shuffle(PK[k].opts)}));return items.length?{type:'poly',items,pos:0,ans:[],tag}:null}
const lessonS=n=>L[n].order.map((o,i)=>'S:'+n+':'+i),lessonP=n=>POLY.filter(p=>p.n===n).map(p=>p.k),lessonU=n=>L[n].units.map(u=>u.k);
function rank(k){return{bad:0,new:1,mid:2,ok:3}[status(k)]}
function weakFirst(keys){return shuffle(keys).sort((a,b)=>rank(a)-rank(b)||(lastSeen(a)<lastSeen(b)?-1:lastSeen(a)>lastSeen(b)?1:0))}
function levelSteps(n,l){const tag={n,lv:l},us=lessonU(n),pick=weakFirst(us),q=t=>weakFirst(lessonQ(n,t));
  if(l===1)return[{type:'wordlist',n,tag},...qSteps(pick.slice(0,8),['write','pyw'],tag)];
  if(l===2){const k=[...q('use').slice(0,4),...q('link').slice(0,3)];
    return k.length?qkSteps(k,tag):[orderStep(lessonS(n),tag),...qSteps(weakFirst(us.filter(k=>U[k].ctx.length)).slice(0,4),['fill'],tag)].filter(Boolean)}
  if(l===3)return[...qkSteps(q('comp').slice(0,4),tag),orderStep(SK['E:'+n]?['E:'+n]:[],tag),{type:'recap',n,tag,t0:0,run:false,left:90}].filter(Boolean);
  if(l===4)return[{type:'armory',n},...qSteps(pick.slice(0,6),['write','pyw'],tag),...qkSteps([...q('use').slice(0,2),...q('link').slice(0,2),...q('comp').slice(0,2)],tag),polyStep(shuffle(lessonP(n)).slice(0,2),tag)].filter(Boolean);
  return[]}
function retestSteps(keys){const u=keys.filter(k=>U[k]),g={};u.forEach(k=>{let t=lastWrongType(k);if(!['write','pyw'].includes(t)||!item(t,k))t='write';(g[t]=g[t]||[]).push(item(t,k))});
  const st=Object.keys(g).map(t=>({type:t,items:g[t],pos:0,ans:[],lost:true}));st.push(...qkSteps(keys,null,true));const o=orderStep(keys,null),p=polyStep(keys,null);if(o){o.lost=true;st.push(o)}if(p){p.lost=true;st.push(p)}return st}
function reviewKeys(ns,k){return weakFirst(ns.flatMap(lessonU)).slice(0,k)}
function todayPlan(){const n=curLesson(),lost=lostKeys().slice(0,3),l=nextLevel(n),steps=[],lvls=[];
  if(lost.length)steps.push(...retestSteps(lost));
  if(l){steps.push(...levelSteps(n,l));lvls.push(l);const l2=l+1;
    if(l2<=4&&!lv(n,l2)&&(l2<4||(lv(n,1)||l===1)&&(lv(n,2)||l===2))&&estMin(steps)<=7){steps.push(...levelSteps(n,l2));lvls.push(l2)}}
  else steps.push(...qSteps(reviewKeys([n],6),['write','pyw'],null),...qkSteps(shuffle(lessonQ(n)).slice(0,6),null));
  return{n,lvls,lost:lost.length,steps}}
const qCount=r=>r.steps.reduce((a,s)=>a+(isQ(s.type)?s.items.length:0),0),aCount=r=>r.steps.reduce((a,s)=>a+(isQ(s.type)?s.ans.filter(Boolean).length:0),0);
const isQ=t=>['listen','py','fill','write','pyw','use','link','comp','order','poly'].includes(t);
function estMin(steps){let s=0;steps.forEach(x=>{s+=x.type==='wordlist'?60:x.type==='learn'?x.items.length*6:x.type==='text'?120:x.type==='recap'?150:x.type==='armory'?60:x.type==='order'?x.items.length*30:['write','pyw'].includes(x.type)?x.items.length*30:isQ(x.type)?x.items.length*20:0});return Math.max(3,Math.round(s/60))}

function mapHTML(cur){const H=150,top=78,xs=[24,52,78,52],pos=LN.map((n,i)=>({n,x:xs[i%4],y:top+i*H})),height=top+(LN.length-1)*H+120;

function startRun(kind,steps,n){steps=steps.filter(Boolean);if(!steps.length)return toast('这里暂时没有题');dayBonus();
  view.run={kind,n,steps,si:0,t0:Date.now(),coins:0,log:[]};view.done=null;
  const l4=steps.filter(s=>s.tag&&s.tag.lv===4&&isQ(s.type));
  if(l4.length){const bn=l4[0].tag.n,q=l4.reduce((a,s)=>a+s.items.length,0),i=LN.indexOf(bn);let B=S.boss[bn],re=false;
    const max=Math.max(50,Math.round(q*18*EXP_ATK[Math.min(i,EXP_ATK.length-1)]/10)*10);
    if(!B)B=S.boss[bn]={max,hp:max};else if(B.beat){B.hp=B.max;re=true}
    view.run.boss={n:bn,re,start:B.hp};save()}
  render()}
function goStep(i){stopSpeak();clearInterval(view.tick);view.run.si=i;renderRun()}
function advance(){if(view.tapping){view.afterTap=advance;return}const r=view.run;if(!r)return;const s=r.steps[r.si];stopSpeak();
  if(isQ(s.type)&&s.pos<s.items.length-1){s.pos++;return renderRun()}
  if(r.si<r.steps.length-1)return goStep(r.si+1);finish()}
function answer(s,i,ok,from){if(s.ans[i])return;const it=s.items[i],r=view.run;s.ans[i]={ok};const g0=S.log[it.k]||[],before=status(it.k),okToday=g0.some(x=>x[0]===today()&&x[1]),oldLoss=before==='bad'&&g0[g0.length-1][0]!==today();rec(it.k,ok,s.type);r.log.push({k:it.k,ok,type:s.type,tag:s.tag});if(r.boss&&s.tag&&s.tag.lv===4)bossAnswer(ok);
  if(ok){sfx.ok();let c=oldLoss?2:okToday?0:1;if(before!=='ok'&&status(it.k)==='ok'){c+=3;setTimeout(()=>toast(`掌握了「${label(it.k)}」+3 🪙`),400)}if(c)addCoins(c,from);if(s.lost&&status(it.k)!=='bad'){S.cleared.push([it.k,today()]);S.cleared=S.cleared.slice(-200)}}else{sfx.bad();shake(from)}save()}
function quit(){stopSpeak();clearInterval(view.tick);if(view.run&&aCount(view.run)>0)return finish();view.run=null;render()}

function renderRun(){const r=view.run,s=r.steps[r.si],M=$('#main');window.scrollTo(0,0);
  const total=r.steps.length,pct=((r.si+(isQ(s.type)?(s.pos+(s.ans[s.pos]?1:0))/s.items.length:0))/total*100);
  const head=(t)=>`<div class="runtop"><button class="x" id="quit" aria-label="退出">✕</button><div class="bar"><i style="width:${pct.toFixed(0)}%"></i></div>${qCount(r)?'<button class="fin" id="fin">交卷</button>':''}</div><div class="lab">${t}</div>`;
  const qlab=()=>`${TYPES[s.type]}${s.lost?' · 收复失地':''} · ${s.pos+1}/${s.items.length}`;
  const qnav=()=>`<div class="qnav"><button id="pv" ${s.pos>0||r.si>0?'':'disabled'}>← 上一题</button><button id="nx">${s.ans&&s.ans[s.pos]?'下一题 →':'跳过 →'}</button></div>`;
  const bind=()=>{$('#quit').onclick=quit;if($('#fin'))$('#fin').onclick=finish;
    if($('#pv'))$('#pv').onclick=()=>{if(s.pos>0){s.pos--;renderRun()}else if(r.si>0){const p=r.steps[r.si-1];if(p.pos!=null&&p.items)p.pos=Math.max(0,p.items.length-1);goStep(r.si-1)}};

  const card=b=>{M.innerHTML=(r.boss&&s.tag&&s.tag.lv===4?bossBar():'')+`<section class="card">${b}</section>`;bind()};

  if(s.type==='armory'){const b=bossOf(s.n),B=S.boss[s.n]||{hp:0,max:0};
    card(`${head('出征前 · 军械库')}<div class="row" style="gap:12px;flex-wrap:nowrap"><span style="font-size:60px;line-height:1">${b[1]}</span><div><h2 style="margin:0">宫殿守卫：${esc(b[0])}</h2><div class="small muted">${esc(b[2])}</div><div class="small" style="margin-top:2px">血量 ${B.hp} / ${B.max}${r.boss&&r.boss.re?' · 再战一次':''}</div></div></div>
      <p class="small" style="margin:12px 0 4px">答对一题：先暴击一下，再给你 4 秒猛点它。答错它会反击，这题进失地（不扣你的金币和兵器）。没打完它就退回宫殿，血量留着，下次接着打。</p>
      ${armHTML()}<button class="big" id="go" style="margin-top:12px">⚔️ 开战</button>`);
    bindArm(renderRun);$('#go').onclick=()=>{sfx.drum();s.fin=true;advance()};return}

  if(s.type==='wordlist'){const us=L[s.n].units;
    card(`${head('生词表')}<h2>第${s.n}课《${esc(L[s.n].t)}》</h2><p class="small muted">先把这一课的字词读一遍。点一个词听读音，不会的多点几次。</p>
      <div class="chips" style="gap:8px">${us.map((u,i)=>`<button class="chip ${status(u.k)==='new'?'':status(u.k)}" data-i="${i}" style="padding:6px 10px;text-align:center"><span style="font:700 22px var(--serif);display:block">${esc(u.w)}</span><span class="small" style="color:var(--bronze)">${esc(u.py)}</span></button>`).join('')}</div>

    document.querySelectorAll('.text p span').forEach(sp=>sp.onclick=()=>{const li=+sp.parentNode.dataset.li,j=+sp.dataset.j,line=lines[li],ch=line[j];
      const u=L[s.n].units.filter(u=>u.w.includes(ch)).find(u=>{const i=line.indexOf(u.w,Math.max(0,j-u.w.length+1));return i>=0&&i<=j&&j<i+u.w.length});

    if($('#skip'))$('#skip').onclick=()=>{s.fin=true;s.skipped=true;advance()};
    $('#go').onclick=()=>{s.fin=true;advance()};return}

  if(['listen','py','fill'].includes(s.type)){const it=s.items[s.pos],u=U[it.k],a=s.ans[s.pos];
    const prompt=s.type==='listen'?`<button class="spk" id="spk">🔊</button><div class="muted">听一听，是哪个${u.kind==='char'?'字':'词'}？</div>`
      :s.type==='py'?`<div class="hz w" style="font:700 40px var(--sans);color:var(--bronze)">${esc(u.py)}</div><div class="muted">选出这个拼音的${u.kind==='char'?'字':'词'}</div>`
      :`<div class="muted">选一个放进空格</div><div class="ctx">${esc(it.ctx).split(esc(u.w)).join('<u>'+(a?esc(u.w):'＿'.repeat(u.w.length))+'</u>')}</div>`;
    card(`${head(qlab())}<div class="stage">${prompt}<div class="opts">${it.opts.map(k=>`<button class="opt ${U[k].w.length>2?'sm':''} ${a?(k===it.k?'right':a.pick===k?'wrong':''):''}" data-k="${k}" ${a?'disabled':''}>${esc(U[k].w)}</button>`).join('')}</div>
      <div class="fb ${a?(a.ok?'ok':'bad'):''}">${a?(a.ok?'对了！':`应该是「${esc(u.w)}」 ${esc(u.py)}`):''}</div></div>${qnav()}`);
    if($('#spk')){$('#spk').onclick=()=>sayUnit(u);if(!a)sayUnit(u)}
    document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const ok=b.dataset.k===it.k;answer(s,s.pos,ok,b);s.ans[s.pos].pick=b.dataset.k;
      if(s.type!=='listen'||!ok)sayUnit(u);renderRun();if(ok)setTimeout(()=>{if(view.run&&view.run.steps[view.run.si]===s&&s.items[s.pos]===it)advance()},900)});return}

  if(s.type==='write'||s.type==='pyw'){const it=s.items[s.pos],u=U[it.k],a=s.ans[s.pos],pw=s.type==='pyw';
    card(`${head(qlab())}<div class="stage"><div class="muted">${pw?'看拼音，在纸上写出这个'+(u.kind==='char'?'字':'词')+'，写好再看答案':'听写：在纸上写下来，写好再看答案'}</div>
      ${pw?`<div style="font:700 40px var(--sans);color:var(--bronze);margin:14px 0">${esc(u.py)}</div>${u.kind==='char'&&!(it.show||a)?`<div class="muted small">提示：${esc(u.h.replace(u.w,'□'))}</div>`:''}<button class="spk sm" id="spk" hidden>🔊</button>`:'<button class="spk" id="spk">🔊</button>'}
      ${it.show||a?`<div class="hz ${u.w.length>1?'w':''}">${esc(u.w)}</div>${pw?'':`<div class="py">${esc(u.py)}</div>`}`:''}
      ${a?`<div class="fb ${a.ok?'ok':'bad'}">${a.ok?'写对了！':'记进失地，下次再考'}</div>`:it.show?`<div class="row" style="margin-top:12px"><button class="btn bad grow" id="no">写错了</button><button class="btn ok grow" id="yes">写对了 ✓</button></div>`:`<button class="btn pri" id="show" style="margin-top:8px">写好了，看答案</button>`}</div>${qnav()}`);
    $('#spk').onclick=()=>sayUnit(u);if(!pw&&!it.show&&!a)sayUnit(u);
    if($('#show'))$('#show').onclick=()=>{it.show=true;renderRun()};
    if($('#yes'))$('#yes').onclick=e=>{answer(s,s.pos,true,e.target);renderRun();setTimeout(()=>{if(view.run&&view.run.steps[view.run.si]===s)advance()},700)};
    if($('#no'))$('#no').onclick=e=>{answer(s,s.pos,false,e.target);renderRun()};return}

  if(['use','link','comp'].includes(s.type)){const it=s.items[s.pos],Q=QK[it.k],a=s.ans[s.pos];
    let qt=esc(Q.q);if(s.type!=='comp'){const parts=Q.a.split(' / ');let i=0;qt=qt.replace(/＿＿/g,()=>`<u>${a?esc(parts[i++]||''):'＿＿'}</u>`)}
    card(`${head(qlab())}<div class="stage"><div class="muted">${{use:'选一个最合适的词',link:'选出正确的一组，填进空格',comp:'根据课文选答案'}[s.type]}</div>
      <div class="ctx" style="text-align:left">${qt}</div>
      <div class="opts" style="grid-template-columns:1fr ${s.type==='comp'?'':'1fr'}">${it.opts.map((o,j)=>`<button class="opt sm" data-j="${j}" style="${s.type==='comp'?'font:600 17px/1.4 var(--sans);text-align:left;padding:12px':''}" ${a?'disabled':''}>${esc(o)}</button>`).join('')}</div>
      <div class="fb ${a?(a.ok?'ok':'bad'):''}">${a?(a.ok?'对了！':'正确答案：'+esc(Q.a)):''}</div></div>${qnav()}`);
    if(a)document.querySelectorAll('.opt').forEach(b=>{const o=it.opts[+b.dataset.j];b.classList.add(o===Q.a?'right':o===a.pick?'wrong':'x')});
    document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const o=it.opts[+b.dataset.j],ok=o===Q.a;answer(s,s.pos,ok,b);s.ans[s.pos].pick=o;renderRun();
      if(ok)setTimeout(()=>{if(view.run&&view.run.steps[view.run.si]===s&&s.items[s.pos]===it)advance()},1100)});return}

  if(s.type==='poly'){const it=s.items[s.pos],p=PK[it.k],a=s.ans[s.pos];
    card(`${head(qlab())}<div class="stage"><div class="muted">这句话里的「${esc(p.c)}」读什么？</div><div class="ctx">${esc(p.ctx).replace(esc(p.c),`<u>${esc(p.c)}</u>`)}</div>
      <div class="opts" style="grid-template-columns:1fr 1fr">${it.opts.map(o=>`<button class="opt" data-o="${o}" style="font-family:var(--sans)" ${a?'disabled':''}>${esc(o)}</button>`).join('')}</div>
      <div class="fb ${a?(a.ok?'ok':'bad'):''}">${a?(a.ok?'对了！':'应该读 '+esc(p.py)):''}</div></div>${qnav()}`);
    if(a)document.querySelectorAll('.opt').forEach(b=>b.classList.add(b.dataset.o===p.py?'right':b.dataset.o===a.pick?'wrong':'x'));
    document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const ok=b.dataset.o===p.py;answer(s,s.pos,ok,b);s.ans[s.pos].pick=b.dataset.o;speak(p.ctx);renderRun()});return}

  if(s.type==='order'){const it=s.items[s.pos],a=s.ans[s.pos];
    const ev=SK[it.k].ev;
    card(`${head(ev?`课文情节排序 · ${s.pos+1}/${s.items.length}`:qlab())}<div class="stage"><div class="muted">${ev?'课文里先发生什么、后发生什么？按顺序点出来':'把词块按顺序点出来，拼成课本里的句子'}</div>
      <div class="built" id="built">${it.picked.map(i=>esc(it.chunks[i])).join(ev?'<br>':'')||'<span class="muted small">点下面的'+(ev?'情节':'词块')+'</span>'}</div>
      <div class="chunks" style="${ev?'flex-direction:column;align-items:stretch':''}">${it.sh.map(i=>`<button class="chunk ${it.picked.includes(i)?'used':''}" data-i="${i}" ${a?'disabled':''}>${esc(it.chunks[i])}</button>`).join('')}</div>
      <div class="fb ${a?(a.ok?'ok':'bad'):''}">${a?(a.ok?'完全正确！':'正确的是：'+(ev?it.chunks.map((c,i)=>(i+1)+'. '+esc(c)).join('　'):esc(SK[it.k].s))):''}</div>
      ${a?'':`<button class="btn" id="redo" style="margin-top:8px" ${it.picked.length?'':'disabled'}>重新排</button>`}</div>${qnav()}`);
    document.querySelectorAll('.chunk').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;if(it.picked.includes(i))return;it.picked.push(i);
      if(it.picked.length===it.chunks.length){const ok=it.picked.map(i=>it.chunks[i]).join('')===it.chunks.join('');answer(s,s.pos,ok,$('#built'));if(!ev)speak(SK[it.k].s)}renderRun()});

      <ol class="cues">${l.cues.map(c=>`<li>${esc(c)}</li>`).join('')}</ol>
      <div class="timer" id="tm">${fmt(s.left)}</div>
      ${s.rated?`<div class="fb ok" style="text-align:center">已记录：${['','再练练','还行','讲得顺'][s.rated]}</div><button class="big" id="go">下一步</button>`
        :s.run||s.stopped?`<button class="btn" id="stop" style="width:100%">${s.stopped?'重新计时':'讲完了，停'}</button><p class="small muted" style="text-align:center;margin:12px 0 6px">家长打分</p><div class="row"><button class="btn bad grow" data-r="1">再练练</button><button class="btn grow" data-r="2">还行</button><button class="btn ok grow" data-r="3">讲得顺</button></div>`
        :`<button class="big" id="start">▶ 开始 90 秒</button>`}
      <button class="btn ghost" id="txt" style="margin-top:6px">先看一遍课文</button>`);
    if($('#start'))$('#start').onclick=()=>{s.run=true;s.left=90;sfx.drum();renderRun();view.tick=setInterval(()=>{s.left--;const t=$('#tm');if(t)t.textContent=fmt(Math.max(0,s.left));if(s.left<=0){clearInterval(view.tick);s.run=false;s.stopped=true;sfx.win();renderRun()}},1000)};

}
const fmt=t=>Math.floor(t/60)+':'+String(t%60).padStart(2,'0');

/* ---------- finish ---------- */
function finish(){const r=view.run;stopSpeak();clearInterval(view.tick);const news=[];
  // reading
  r.steps.forEach(s=>{if(s.type==='text'&&s.reading&&s.fin&&!s.skipped){if(!S.read[r.n]){S.read[r.n]=today();addCoins(3)}}});
  // levels
  const groups={};r.steps.forEach(s=>{if(!s.tag)return;const g=groups[s.tag.n+'-'+s.tag.lv]=groups[s.tag.n+'-'+s.tag.lv]||{n:s.tag.n,lv:s.tag.lv,q:0,a:0,ok:0,learn:true,rate:0};
    if(isQ(s.type)){g.q+=s.items.length;s.ans.forEach(x=>{if(x){g.a++;if(x.ok)g.ok++}})}if((s.type==='learn'||s.type==='wordlist')&&!s.fin)g.learn=false;if(s.type==='recap')g.rate=s.rated||0;if(s.type==='comp')s.ans.forEach(x=>{if(x){g.ca=(g.ca||0)+1;if(x.ok)g.cok=(g.cok||0)+1}})});
  view.freshLv=[];Object.values(groups).forEach(g=>{let st=0;
    if(g.lv===3){st=g.rate;if(g.ca&&g.cok/g.ca<.6)st=Math.min(st,1)}else if(g.learn&&g.a>=Math.min(6,g.q)&&g.a>0){const acc=g.ok/g.a;st=acc===1&&g.a>=g.q?3:acc>=.8?2:acc>=.6?1:0}
    const before=lv(g.n,g.lv);if(st>before){setLv(g.n,g.lv,st);if(!before)news.push({n:g.n,lv:g.lv});if(st>before)view.freshLv.push(g.n+'-'+g.lv);if(st===3&&before<3)addCoins(5)}});
  const acc=r.log.length?r.log.filter(x=>x.ok).length/r.log.length:0;
  S.sessions.push({d:today(),kind:r.kind,n:r.n,q:r.log.length,ok:r.log.filter(x=>x.ok).length,sec:((Date.now()-r.t0)/1000)|0});S.sessions=S.sessions.slice(-120);
  save();view.done={r,news,acc};view.run=null;render()}

function renderDone(){const{r,news,acc}=view.done,wrong=[...new Set(r.log.filter(x=>!x.ok).map(x=>x.k))];paint();
  const q=r.log.length;

    const pick=[],by={use:[],link:[],comp:[]};qk.forEach(x=>by[QK[x].type].push(x));let i=0;while(pick.length<k&&(by.use.length||by.link.length||by.comp.length)){const t=['use','link','comp'][i++%3];if(by[t].length)pick.push(by[t].shift())}

  document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{R.m=+b.dataset.m;renderReview()});

/* ====================== 多设备同步（存在 Wendi 的 Google Drive，和 Eric 版共用同一个 Apps Script，kid=edwin） ====================== */
const SYNC_URL='https://script.google.com/macros/s/AKfycbwxFxHEbEV2Y_l72QCt7Imk9198Sza_zPMrmnKoCgwexwKdTVpjFJKpvebSnzMlqPD-/exec';
const SYK=KEY+'.sync',BK=KEY+'.base',KID='edwin';
let SY={};try{SY=JSON.parse(localStorage.getItem(SYK)||'null')||{}}catch(e){}
const syncUrl=()=>SY.url||SYNC_URL;
const syncOn=()=>!!(syncUrl()&&SY.code&&SY.linked);
const sySave=()=>{try{localStorage.setItem(SYK,JSON.stringify(SY))}catch(e){}};
const getBase=()=>{try{return JSON.parse(localStorage.getItem(BK)||'null')}catch(e){return null}};
const setBase=d=>{try{localStorage.setItem(BK,JSON.stringify(d))}catch(e){}};
const J=x=>JSON.stringify(x);
// 三方合并：b=上次同步时的版本，l=这台设备，s=云端。
// 金币类两边的增量相加；关卡星级、兑换点取大；Boss 剩余血量取小；数组合并去重；其他以这台设备为准
const COUNTERS=new Set(['coins','earned']),MAXK=/^(lv\.|spent$)/,MINK=/^boss\.[^.]+\.hp$/;
function m3(b,l,s,path){
  if(J(l)===J(b))return s;if(J(s)===J(b))return l;
  if(typeof l==='number'&&typeof s==='number'){if(COUNTERS.has(path))return s+l-(typeof b==='number'?b:0);if(MAXK.test(path))return Math.max(l,s);if(MINK.test(path))return Math.min(l,s);return l}
  if(Array.isArray(l)&&Array.isArray(s)){const seen=new Set(s.map(J)),out=[...s];l.forEach(x=>{const k=J(x);if(!seen.has(k)){seen.add(k);out.push(x)}});
    if(path==='sessions')out.sort((x,y)=>String(x.d).localeCompare(String(y.d)));if(path==='days')out.sort();return out}
  if(l&&s&&typeof l==='object'&&typeof s==='object'&&!Array.isArray(l)&&!Array.isArray(s)){const o={},bb=b&&typeof b==='object'?b:{};
    new Set([...Object.keys(l),...Object.keys(s)]).forEach(k=>{const v=m3(bb[k],l[k],s[k],path?path+'.'+k:k);if(v!==undefined)o[k]=v});return o}
  return l}
const isBusy=()=>!!(view.run||view.tapping||view.done);
const fresh=()=>!S.sessions.length&&!S.coins&&!Object.keys(S.log).length;
function syLoad(data){S=Object.assign({},S0,data);migrate()}
function syAdopt(data,rev){syLoad(data);SY.rev=rev;SY.dirty=false;setBase(data);save(true)}
const syQ=()=>{const u=syncUrl();return u+(u.includes('?')?'&':'?')+'key='+encodeURIComponent(SY.code)+'&kid='+KID+'&t='+Date.now()};
async function syFetch(body){const o={cache:'no-store',credentials:'omit',redirect:'follow'};
  const r=body?await fetch(syncUrl(),{...o,method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:J(body)}):await fetch(syQ(),o);
  if(!r.ok)throw new Error('HTTP '+r.status);const t=await r.text();try{return JSON.parse(t)}catch(e){throw new Error('回应不是数据：'+t.slice(0,40))}}
// 备用通道：有的设备/网络挡了跨域 fetch，就用 <script> 读（JSONP），写的时候用 no-cors POST 再读回来确认
function syJsonp(){return new Promise((res,rej)=>{const cb='__sy'+Date.now()+(Math.random()*1e4|0),s=document.createElement('script');let done=false;
  const end=e=>{if(done)return;done=true;clearTimeout(t);delete window[cb];s.remove();e?rej(e):0};
  window[cb]=d=>{end();res(d)};s.onerror=()=>end(new Error('备用通道也连不上'));const t=setTimeout(()=>end(new Error('备用通道超时')),20000);
  s.src=syQ()+'&callback='+cb;document.head.appendChild(s)})}
async function syReqAlt(body){if(!body)return syJsonp();
  await fetch(syncUrl(),{method:'POST',mode:'no-cors',cache:'no-store',credentials:'omit',body:J(body)});
  const s=await syJsonp();if(!s.ok)return s;
  if(s.rev===body.baseRev+1&&J(s.data)===J(body.data))return{ok:true,rev:s.rev};
  if(s.rev!==body.baseRev)return{ok:false,conflict:true,rev:s.rev,data:s.data};
  throw new Error('上传没成功')}
async function syReq(body){
  if(SY.alt)return syReqAlt(body);
  try{return await syFetch(body)}catch(e){SY.fetchErr=String(e&&e.message||e);
    const r=await syReqAlt(body);SY.alt=true;sySave();return r}}
let syT=null,syBusy=false;
function syncDirty(){if(!syncOn())return;SY.dirty=true;sySave();clearTimeout(syT);syT=setTimeout(()=>syncNow(),2500)}
async function syncNow(){if(!syncOn()||syBusy||!navigator.onLine)return;syBusy=true;let changed=false;
  try{let r=await syReq();if(!r.ok)throw new Error(r.err==='key'?'同步码不对':r.err||'云端出错');
    for(let tries=0;;tries++){
      if(r.rev!==SY.rev&&r.data){
        if(isBusy()){SY.later=true;break}
        if(!SY.dirty){syAdopt(r.data,r.rev);changed=true;break}
        const m=m3(getBase()||{},JSON.parse(J(S)),r.data,'');syLoad(m);SY.rev=r.rev;save(true);changed=true}
      else if(!SY.dirty){SY.rev=r.rev;break}
      const data=JSON.parse(J(S)),p=await syReq({key:SY.code,kid:KID,baseRev:SY.rev||0,data});
      if(p.ok){SY.rev=p.rev;SY.dirty=false;setBase(data);break}
      if(p.conflict&&tries<3){r=p;continue}
      throw new Error(p.err==='key'?'同步码不对':'上传失败')}
    SY.last=Date.now();SY.err=''}
  catch(e){SY.err=(e instanceof TypeError?'暂时连不上网，联网后会自动补传':String(e&&e.message||e))+(SY.fetchErr?'（'+SY.fetchErr+'）':'')}
  finally{syBusy=false;sySave();paintSync();if(changed&&!isBusy()&&!$('#modal').innerHTML)render()}}
function paintSync(){const el=$('#syncSt');if(!el)return;
  el.innerHTML=SY.err?`<span style="color:var(--red)">⚠️ ${esc(SY.err)}</span>`:SY.last?`✓ 上次同步 ${md(dstr(new Date(SY.last)))} ${new Date(SY.last).toTimeString().slice(0,5)}${SY.dirty?' · 有新记录等上传':''}`:'连接中…'}
async function syncLink(code){code=code.trim().toLowerCase();if(!code)return toast('请输入同步码');if(!syncUrl())return toast('云端还没设置好');
  SY.code=code;let r;try{r=await syReq()}catch(e){SY.code='';return toast('连不上云端：'+(e&&e.message||e)+(SY.fetchErr?' / '+SY.fetchErr:''))}
  if(!r.ok){SY.code='';return toast(r.err==='key'?'同步码不对':'云端出错')}
  const go=mode=>{$('#modal').innerHTML='';SY.linked=true;
    if(mode==='cloud')syAdopt(r.data,r.rev);
    else{SY.rev=r.data?r.rev:(r.rev||0);setBase({});SY.dirty=true;if(r.data){syLoad(m3({},JSON.parse(J(S)),r.data,''));save(true)}}
    sySave();toast('已连接，开始同步');render();syncNow()};
  if(!r.data||fresh())return go(r.data?'cloud':'mine');
  $('#modal').innerHTML=`<div class="modal"><div class="box"><div class="ic">☁️</div><h2>云端已经有记录了</h2>
    <p class="muted small">这台设备上也有记录（🪙 ${S.coins}，${S.sessions.length} 次练习）。云端是别的设备上传的。</p>
    <button class="big" id="syM">合并两边（推荐）</button><p class="small muted">金币、兵器、城池、失地都合在一起。</p>
    <button class="btn" style="width:100%;margin-top:6px" id="syC">只用云端的，这台的不要了</button>
    <button class="btn ghost" style="width:100%;margin-top:6px" id="syX">先不连</button></div></div>`;
  $('#syM').onclick=()=>go('mine');$('#syC').onclick=()=>go('cloud');$('#syX').onclick=()=>{SY.code='';$('#modal').innerHTML=''}}
function syncCard(){
  return`<section class="card"><h3>☁️ 多设备同步</h3>
    ${syncOn()?`<p class="small muted">这台设备已经连上，记录会自动和其他设备互通（存在妈妈的 Google Drive，每天自动另存一份备份）。</p>
      <div class="small" id="syncSt"></div>
      <div class="row" style="margin-top:8px"><button class="btn grow" id="syNow">立即同步</button><button class="btn ghost grow" id="syOff">这台设备断开</button></div>`
    :syncUrl()?`<p class="small muted">在每台设备上输一次同步码，金币、兵器、城池和失地就会自动互通。</p>
      <div class="row"><input class="in" id="syCode" placeholder="同步码" autocapitalize="off" autocomplete="off" style="flex:1"><button class="btn pri" id="syGo">连接</button></div>`
    :`<p class="small muted">云端还没设置好。</p>`}
    <details style="margin-top:8px"><summary class="small muted">高级</summary><input class="in" id="syUrl" placeholder="同步网址（一般不用填）" value="${esc(SY.url||'')}" style="margin-top:8px;width:100%"><button class="btn" style="margin-top:6px" id="syUrlS">保存网址</button></details>
  </section>`}
function bindSync(){paintSync();
  if($('#syGo'))$('#syGo').onclick=()=>syncLink($('#syCode').value);
  if($('#syNow'))$('#syNow').onclick=async()=>{SY.err='';paintSync();await syncNow();toast(SY.err?'同步失败：'+SY.err:'同步好了')};
  if($('#syOff'))$('#syOff').onclick=()=>{SY={url:SY.url};sySave();toast('这台设备已断开，记录还在本机');render()};
  $('#syUrlS').onclick=()=>{SY.url=$('#syUrl').value.trim();SY.linked=false;sySave();render()}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')syncNow();else if(SY.dirty)syncNow()});
window.addEventListener('online',()=>syncNow());

if('serviceWorker'in navigator&&location.protocol==='https:'&&!/claude/.test(location.host))navigator.serviceWorker.register('sw.js').catch(()=>{});
render();
syncNow();
</script>
